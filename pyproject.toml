[build-system]
requires = ["hatchling>=1.17.0"]
build-backend = "hatchling.build"

[project]
name = "rapidtriage"
version = "0.2.0"
description = "Local-first rapid forensic triage CLI with a local web console"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "shinyoohag", email = "" }]
keywords = ["dashcam", "ocr", "rename", "forensics", "E01", "ewf"]
license = { text = "Proprietary" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "License :: Other/Proprietary License",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
dependencies = [
  "opencv-python>=4.7",
  "pytesseract>=0.3.10",
  "numpy>=1.23",
]

[project.optional-dependencies]
# E01 extraction uses external tools (ewfmount, sleuthkit) not python deps
full = []
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
test = [
  "build>=1.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "jsonschema>=4.0",
  "Pillow>=10",
  "pip-audit>=2.7",
  "pycryptodome>=3.20",
  "ruff==0.8.*",
  "vulture>=2.11",
]
columnar = [
  "pyarrow>=15",
  "duckdb>=0.10",
]
kakaotalk = [
  "openpyxl>=3.1",
  "pycryptodome>=3.20",
]

[project.scripts]
dashcam-report = "dashcam_tools.report:main"
dashcam-gui = "dashcam_tools.gui:main"
dashcam-rename = "dashcam_tools.rename:cli"
dashcam-ingest = "dashcam_tools.ingest:cli"
rapidtriage = "rapidtriage.cli:main"
rapidtriage-web = "rapidtriage.cli:web_main"

[tool.hatch.build.targets.wheel]
packages = ["dashcam_tools", "rapidtriage"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
