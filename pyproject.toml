[build-system]
requires = ["hatchling>=1.17.0"]
build-backend = "hatchling.build"

[project]
name = "rapidtriage"
version = "0.2.0"
description = "Local-first rapid forensic triage CLI with a local web console"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "shinyoohag", email = "" }]
keywords = ["dashcam", "ocr", "rename", "forensics", "E01", "ewf"]
license = { text = "Proprietary" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "License :: Other/Proprietary License",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
dependencies = [
  "opencv-python>=4.7",
  "pytesseract>=0.3.10",
  "numpy>=1.23",
]

[project.optional-dependencies]
# E01 extraction uses external tools (ewfmount, sleuthkit) not python deps
full = []
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
test = [
  "build>=1.0",
  "coverage>=7.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "jsonschema>=4.0",
  "Pillow>=10",
  "pip-audit>=2.7",
  "pycryptodome>=3.20",
  "ruff==0.16.*",
  "vulture>=2.11",
]
columnar = [
  "pyarrow>=15",
  "duckdb>=0.10",
]
kakaotalk = [
  "openpyxl>=3.1",
  "pycryptodome>=3.20",
]

[project.scripts]
dashcam-report = "dashcam_tools.report:main"
dashcam-gui = "dashcam_tools.gui:main"
dashcam-rename = "dashcam_tools.rename:cli"
dashcam-ingest = "dashcam_tools.ingest:cli"
rapidtriage = "rapidtriage.cli:main"
rapidtriage-web = "rapidtriage.cli:web_main"

[tool.hatch.build.targets.wheel]
packages = ["dashcam_tools", "rapidtriage"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Rules disabled after the 2026-09 ruff 0.16 cleanup pass, with reasons:
# - BLE001: parsers must isolate crashes and continue runs (parser crash
#   isolation contract); blind-except is intentional in collector loops.
# - DTZ001/DTZ005/DTZ006/DTZ007: legacy local-time call sites were audited in
#   the 2026-08 CI-green pass; output rendering is UTC-standardized and
#   covered by tests. Remaining call sites feed non-output paths.
# - TRY004/TRY203/SIM101/SIM102/SIM103/SIM113/SIM115/SIM117/SIM118/C401/C405/
#   C408/FLY002/FURB192/ISC004/PIE810/PERF402/PYI034/RUF007/RUF015/RUF046/
#   RUF059/S112/UP007/UP022/B008/PLW1510: style/judgment calls deferred; none
#   change behavior. Revisit individually in a dedicated review pass.
ignore = [
  "BLE001",
  "DTZ001", "DTZ005", "DTZ006", "DTZ007",
  "TRY004", "TRY203",
  "S101", "S112",
  "B008",
  "PLW1510",
  "SIM101", "SIM102", "SIM103", "SIM113", "SIM115", "SIM117", "SIM118",
  "C401", "C405", "C408",
  "FLY002", "FURB192", "ISC004", "PIE810", "PERF402",
  "PYI034", "RUF007", "RUF015", "RUF046", "RUF059",
  "UP007", "UP022",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

# Coverage gate: `coverage report` fails under fail_under. The floor is
# set below the measured baseline (82% branch coverage as of 2026-09) so
# small fluctuations do not break the build; raise it as coverage grows.
# See docs/rapidtriage-quality-checks.md.
[tool.coverage.run]
source = ["rapidtriage"]
omit = [
  "tests/*",
  "*/__init__.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = false
fail_under = 80
