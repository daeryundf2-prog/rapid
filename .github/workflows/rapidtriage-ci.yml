name: RapidTriage CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: Python test and release checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip build
          python -m pip install -e ".[web,test]"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Compile package
        run: python -m compileall -q rapidtriage

      - name: Check web JavaScript syntax
        if: matrix.os != 'windows-latest'
        run: node --check rapidtriage/web/static/app.js

      - name: Build release package
        run: python scripts/build-release.py --output-dir release-ci --skip-build

      - name: Verify release checksums
        run: python scripts/build-release.py --output-dir release-ci --verify

      - name: Build validation package
        run: python -m rapidtriage validation --output-dir release-validation-ci --overwrite --json
