name: RapidTriage CI

# Trigger/matrix policy (R8 CI-green decision default + T-153; owner can revert):
# - Pull requests are the gate: ubuntu + windows on Python 3.12, fast unit tier
#   (scripts/dev/run-tests.py --tier fast, slow modules excluded), e2e smoke only,
#   20-minute job limit. Feature-branch pushes do not start a second run next to the PR run.
# - Push to main and manual dispatch run the full matrix (ubuntu/windows/macos, Python 3.12)
#   with the full unit tier (`gh workflow run "RapidTriage CI" --ref <branch>`).
# - The nightly schedule lives in nightly.yml (full tier incl. the slow modules, macOS, full
#   Playwright e2e), so this workflow no longer has a `schedule:` trigger and a commit is not
#   tested twice by the same workflow.
# - A newer push to the same PR cancels the superseded PR run; main runs are never cancelled.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python test and release checks
    runs-on: ${{ matrix.os }}
    # PR gate wall clock <= 20 minutes (T-153); full tier on main/dispatch gets 45.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        # requires-python >= 3.12 (T-009): 3.11 left the matrix with the lock files.
        python-version: ["3.12"]
    env:
      # fast = everything except the slow modules in scripts/dev/test-tiers.json.
      TEST_TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hashed lock files
        # Same install path as dependency-monitoring.yml: the hashed dev lock carries the
        # runtime + test extra (ruff, vulture, build, pip-audit included); the package
        # itself goes in editable without re-resolving dependencies.
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Static analysis
        run: |
          python -m ruff check rapidtriage tests scripts
          python -m vulture rapidtriage tests scripts --min-confidence 80

      - name: Compile package
        run: python -m compileall -q rapidtriage tests scripts

      - name: Repository guards (exec bits, architecture)
        # Cheap structural checks first so they fail in seconds, not after the unit tier.
        run: python -m unittest tests.test_script_exec_bits tests.test_architecture

      - name: Run tests
        # Parallel runner (T-006): module batches per worker, per-module limit
        # max(300 s, 3 x recorded duration); a hung module is killed and named in the JSON.
        run: python scripts/dev/run-tests.py --tier ${{ env.TEST_TIER }} --workers 4 --timeout-floor 300 --timeout-factor 3 --state-dir run-tests-state --json-out run-tests-${{ env.TEST_TIER }}.json

      - name: Upload test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-tests-${{ env.TEST_TIER }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            run-tests-${{ env.TEST_TIER }}.json
            run-tests-state/
          if-no-files-found: warn
          retention-days: 14

      - name: Audit Python dependencies
        # Non-blocking visibility step: pip-audit (from the test extra)
        # audits the hashed lock files (not the runner's site-packages)
        # without failing the build. Open findings: docs/dependency-lock-exceptions.md.
        continue-on-error: true
        run: python -m pip_audit -r requirements.lock -r requirements-dev.lock --require-hashes --disable-pip

      - name: Check doc path references
        # Gate: fails on stale repo-path references in maintained markdown
        # docs. Acknowledged historical docs carrying the
        # "_Historical document — paths may reference pre-refactor layout._"
        # banner are suppressed; other historical record docs are
        # informational only.
        run: python scripts/check-doc-refs.py

      - name: Validate known-answer plumbing
        run: |
          python scripts/known-answer-qc.py --manifest tests/fixtures/known_answer/tier0-basic/manifest.json --check-files --fixture-root tests/fixtures/known_answer/tier0-basic/files --json
          python scripts/trusted-diff.py --manifest tests/fixtures/known_answer/tier0-basic/manifest.json --rapid-results tests/fixtures/known_answer/tier0-basic/rapid-results.json --trusted-results tests/fixtures/known_answer/tier0-basic/trusted-results.json --json
          python scripts/normalize-trusted-export.py --tool synthetic-tsv --input tests/fixtures/known_answer/tier0-basic/synthetic-trusted-export.tsv --json
          python scripts/build-evidence-bundle.py --root tests/fixtures/known_answer/tier0-basic --json

      - name: Check web JavaScript syntax
        if: matrix.os != 'windows-latest'
        run: |
          for f in rapidtriage/web/static/*.js; do node --check "$f"; done

      - name: Build release package
        run: python scripts/build-release.py --output-dir release-ci --skip-build

      - name: Verify release checksums
        run: python scripts/build-release.py --output-dir release-ci --verify

      - name: Build validation package
        run: python -m rapidtriage validation --output-dir release-validation-ci --overwrite --json

      - name: Build benchmark evidence
        run: python -m rapidtriage benchmark --output-dir release-benchmark-ci --file-count 10 --search-iterations 1 --overwrite --json

      - name: Verify release evidence
        run: python scripts/verify-release-evidence.py --release-dir release-ci --validation-dir release-validation-ci --benchmark-dir release-benchmark-ci --minimum-smoke-count 0 --output-dir release-evidence-ci

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[web]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate schema types
        id: schemas
        working-directory: frontend
        run: npm run gen:schemas

      # Each check below reports its own result: a lint failure no longer hides
      # typecheck/vitest/build/e2e (they never ran in CI while lint was red).
      - name: Lint
        if: ${{ !cancelled() && steps.schemas.outcome == 'success' }}
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.schemas.outcome == 'success' }}
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.schemas.outcome == 'success' }}
        working-directory: frontend
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.schemas.outcome == 'success' }}
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        id: playwright
        if: ${{ !cancelled() && steps.schemas.outcome == 'success' }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        # PRs run the intake smoke spec (same as gate.py L3); main/dispatch and nightly.yml
        # run every spec (T-153: full e2e moves off the PR gate).
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        working-directory: frontend
        run: npm run e2e -- ${{ github.event_name == 'pull_request' && 'case-intake.spec.ts' || '' }}

  contract-drift:
    name: Vendored contract drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check contract drift
        # Gate: contracts/ vendors lazy-contracts; fails when file hashes
        # drift from the sha256 pinned in contracts/PIN.json.
        run: python scripts/check-contract-drift.py

  rust-worker:
    name: Rust worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Rust formatting
        working-directory: engines/rust
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        working-directory: engines/rust
        run: cargo check --workspace --all-targets --locked

      - name: Test Rust workspace
        working-directory: engines/rust
        run: cargo test --workspace --locked

      - name: Build rapid-worker
        working-directory: engines/rust
        run: cargo build --bin rapid-worker --locked

      - name: Run worker Case DB smoke
        run: python scripts/worker-case-db-smoke.py --worker engines/rust/target/debug/rapid-worker
