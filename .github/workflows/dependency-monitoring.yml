name: RapidTriage dependency monitoring

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/check-dependencies.py"
      - ".github/workflows/dependency-monitoring.yml"

permissions:
  contents: read

jobs:
  dependency-monitoring:
    name: Dependency advisory, SBOM, and severity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and advisory scanner in a clean venv
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
          python -m pip install pip-audit cyclonedx-bom

      - name: Record scanner and advisory database versions
        run: |
          {
            echo '{'
            echo '  "profile_version": "dependency-scanner-environment-v1",'
            echo '  "captured_at_utc": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",'
            echo '  "pip_audit_version": "'"$(python -m pip_audit --version 2>/dev/null | awk '{print $2}')"'",'
            echo '  "python_version": "'"$(python --version 2>&1)"'",'
            echo '  "os": "'"$(lsb_release -ds 2>/dev/null || uname -s)"'"'
            echo '}'
          } > dependency-scanner-environment.json
          cat dependency-scanner-environment.json

      - name: Build dependency monitoring evidence
        run: python scripts/check-dependencies.py --output dependency-monitoring-ci.json

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip_audit --format cyclonedx-json -o rapidtriage-sbom.cdx.json > /dev/null 2>&1 || true
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("rapidtriage-sbom.cdx.json")
          if path.exists():
              document = json.loads(path.read_text(encoding="utf-8"))
              components = document.get("components", [])
              print(f"CycloneDX SBOM generated: {len(components)} components")
          else:
              raise SystemExit("SBOM generation did not produce a file")
          PY

      - name: Advisory severity gate notice (disclosed-blocker policy)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dependency-monitoring-ci.json").read_text(encoding="utf-8"))
          scan = payload.get("vulnerability_scan") or {}
          raw = str(scan.get("raw_output") or "")
          findings = [line for line in raw.splitlines() if "known vulnerabilities" in line.lower() or "No known vulnerabilities" in line]
          print("Scanner available:", scan.get("available"), "| return code:", scan.get("return_code"))
          for line in findings:
              print("Advisories:", line.strip())
          print("Release gate policy: disclosed-blocker mode — high/critical findings must be triaged in")
          print("dependency evidence and signed off by an independent dependency review before a release claim.")
          print("commercial_claim_allowed remains false while findings are open.")
          PY

      - name: Upload dependency monitoring and SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: rapidtriage-dependency-monitoring
          path: |
            dependency-monitoring-ci.json
            dependency-scanner-environment.json
            rapidtriage-sbom.cdx.json
