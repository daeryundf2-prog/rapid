name: RapidTriage nightly

# Nightly half of the T-153 split (rapidtriage-ci.yml is the PR/main gate):
# - full unit tier, including the slow modules listed in scripts/dev/test-tiers.json,
#   on ubuntu + windows + macos (macOS is not on the PR gate);
# - every Playwright e2e spec (PRs only run the case-intake smoke spec).
# Manual run: gh workflow run "RapidTriage nightly" --ref <branch>
on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-full:
    name: Full unit tier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hashed lock files
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Static analysis
        run: |
          python -m ruff check rapidtriage tests scripts
          python -m vulture rapidtriage tests scripts --min-confidence 80

      - name: Compile package
        run: python -m compileall -q rapidtriage tests scripts

      - name: Repository guards (exec bits, architecture)
        run: python -m unittest tests.test_script_exec_bits tests.test_architecture

      - name: Run tests (full tier incl. slow modules)
        run: python scripts/dev/run-tests.py --tier full --workers 4 --timeout-floor 300 --timeout-factor 3 --state-dir run-tests-state --json-out run-tests-full.json

      - name: Upload test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-run-tests-full-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            run-tests-full.json
            run-tests-state/
          if-no-files-found: warn
          retention-days: 14

  e2e-full:
    name: Full Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[web]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate schema types
        working-directory: frontend
        run: npm run gen:schemas

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests (all specs)
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
