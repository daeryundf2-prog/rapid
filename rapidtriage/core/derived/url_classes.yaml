# URL 분류 규칙 (plan axiom-adoption-2026-10-17 §3.2 "URL 분류"): 통합 보기 › URL 분류 표의 `url_class`.
#
# 한 호스트는 목록 도메인과 같거나 그 하위 도메인일 때(`mail.naver.com` ⊂ `naver.com`) 그 분류가 되고,
# 여러 분류에 걸리면 가장 긴(구체적인) 도메인의 분류를 쓴다. 목록은 조사 우선순위를 돕는 단서이며
# 판단이 아니다: "악성 의심"은 공격에 자주 남용되는 무료 호스팅·터널·단축·붙여넣기 도메인이지 악성 판정이 아니다.
# 각 분류의 sources는 목록을 고른 근거(공개 목록·문서)다. 도메인은 소문자, 스킴·경로·포트 없이 적는다.
# (R5 L3) paths는 어느 호스트든 그 경로 접두어로 시작하는 URL을 분류한다(사내 Outlook Web App `/owa/`):
# 표는 호스트 단위라서 그 호스트의 URL 하나라도 접두어에 맞으면 호스트가 그 분류가 된다(호스트 도메인 분류가 우선).
# schemes는 HTTP가 아닌 스킴(`magnet:`)을 분류하며, 그런 URL은 `<스킴>:<식별자>`(magnet은 info-hash) 키로 묶인다.
