  - key: candidate_value
    label: 후보 값
    format: mono
  - key: candidate_value_sha256
    label: 후보 값 SHA-256
    format: mono
  - key: evidence_nature
    label: 증거 성격
  - key: registry_key_path
    label: 레지스트리 키
    format: path
  - key: registry_value_name
    label: 레지스트리 값
    format: mono
  - key: decoded_strings
    label: 해석된 문자열
  aux_columns:
  - key: field_names
    label: 필드
  - key: values_redacted
    label: 값 가림
  - key: matched_terms
    label: 일치한 용어
  - key: path_candidates
    label: 경로·URL 후보
    aliases:
    - url_candidates
