    - sent_at
    format: time
    ts_kind: sent
    width: 170
  - key: service
    label: 앱
    aliases:
    - app
  - key: conversation_title
    label: 대화방
    aliases:
    - conversation_id
    - chat_room
  - key: sender
    label: 발화자
  - key: recipient
    label: 상대
    aliases:
    - participants
    - counterpart
  - key: direction
    label: 방향
    width: 70
  - key: message_text_preview
    label: 본문
    aliases:
    - message_text
    - body
    width: 320
  - key: attachment_name
    label: 첨부
    aliases:
    - media_reference
  - key: deleted_state
    label: 삭제 여부
    width: 90
  - key: read_state
    label: 읽음 상태
    aliases:
    - status
    width: 90
  aux_columns:
  - key: message_id
    label: 메시지 ID
    format: mono
  - key: reply_to_message_id
    label: 답장 대상
    format: mono
  - key: edited_at
    label: 수정
    format: time
    ts_kind: edited
  - key: reaction
    label: 반응
  - key: server_timestamp
    label: 서버 시각
    aliases:
    - receipt_server_timestamp
    format: time
    ts_kind: server
  - key: app_version
    label: 앱 버전
  - key: source_path
    label: 원본 DB
    format: path
  rules:
  - messenger.time_regression
  - messenger.server_client_skew
  - messenger.id_gap
  - messenger.deleted_recovered
  - messenger.disappearing_on
  - messenger.external_share_link
  - messenger.late_night_burst
  - messenger.attachment_missing
  - messenger.app_reinstall_gap
- id: kakaotalk
  label: 카카오톡 후보
  types: []
  prefixes:
  - kakaotalk-windows-
  core_columns:
  - key: registry_key_last_written
    label: 키 마지막 기록
    format: time
