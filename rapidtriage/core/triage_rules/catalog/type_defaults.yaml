# Triage catalogue: type defaults (R8 T-045, plan r8-redesign-2026-11-11 §4.2).
# Artifact types no family's grid shows still need a place in the console's categories: each
# entry gives the ``tier`` (1 = 첫 화면, 2 = 더 보기, 3 = 전문가), the ``card`` (one of the 12 card
# ids, or null) and the ``section`` (sub-tab, or the Tier 2/3 group) of the types it names.
# classify() order: family (by type) -> exact ``types`` here -> ``prefixes`` -> ``suffixes``
# -> family (by kind) -> ``kinds`` here -> "unclassified" (Tier 3). A type listed here that a
# family's ``types`` already names is an error (it would never be read).
type_defaults:
# Documents
- types: [sticky-note]
  tier: 1
  card: documents
  section: sticky-notes
- types: [windows-search-edb-row-candidate, windows-search-row-candidate, windows-search-index-entry, windows-search-edb-pivot]
  tier: 2
  card: documents
  section: windows-search
- types: [windows-search-db, windows-search-edb-file, windows-search-edb-page-candidate, windows-search-edb-table-candidate]
  tier: 3
  card: null
  section: windows-search
