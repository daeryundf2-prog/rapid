# Triage catalogue: cloud (plan viewer-families-2026-10-15; research docs/research/forensic-field-catalog-*.md)
families:
- id: cloud
  label: 클라우드
  types:
  - cloud-activity
  - cloud-audit
  - cloud-iaas-audit
  - cloud-file
  - cloud-account
  - cloud-location
  - cloud-export-archive
  - ai-service-export-conversation
  kinds:
  - cloud-export
  core_columns:
  - key: timestamp
    label: 시각
    aliases:
    - event_time
    format: time
    ts_kind: event
    width: 170
  - key: service
    label: 서비스
  - key: actor
    semantic: account
    label: 계정
    aliases:
    - account
    - account_email
  - key: object_id
    label: 항목
    aliases:
    - item_path
    - file_path
    - file_name
    - subject
  - key: operation
    label: 활동
    aliases:
    - activity
    - event_type
  - key: size
    label: 크기
    aliases:
    - size_bytes
    format: bytes
  - key: shared_with
    semantic: person_recipient
    label: 공유 대상
    aliases:
    - sharing_link_count
  - key: ip_address
    semantic: device
    label: IP·기기
    aliases:
    - client_ip
    - user_agent
    format: mono
  - key: photo_taken_time
    label: 촬영 시각
    format: time
    ts_kind: taken
  - key: latitude
    semantic: geo
    label: 위치
    aliases:
    - geo_data
  aux_columns:
  - key: permission_roles
    label: 권한
  - key: deleted_status
    label: 삭제 상태
    aliases:
    - deleted_at
  - key: retention_label
    label: 보존 레이블
  - key: archive_entry_name
    semantic: path
    label: 보관 파일 항목
    format: path
  rules:
  - cloud.bulk_download
  - cloud.bulk_upload
  - cloud.external_share
  - cloud.new_device_login
  - cloud.delete_after_share
  - cloud.taken_vs_creation_gap
  - cloud.json_exif_gps_mismatch
  - cloud.audit_retention_gap
# Desktop sync clients (R2 M4, rapidtriage/artifacts/cloud_sync.py): OneDrive, Dropbox,
# Google Drive (DriveFS), Naver MYBOX, iCloud for Windows. Three families (r2 console fix m1):
# accounts (client · account · sync folder · tenant · account id), files/events, inventory.
- id: cloud-sync-account
  label: 클라우드 동기화 계정
  types:
  - cloud-sync-account
  core_columns:
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: actor
    semantic: account
    label: 계정
    aliases:
    - account
    - account_email
  - key: sync_root
    semantic: path
    label: 동기화 폴더
    aliases:
    - sync_roots
    format: path
  - key: tenant
    label: 테넌트
  - key: account_id
    semantic: account
    label: 계정 ID
    format: mono
  - key: site_url
    semantic: url
    label: 사이트 URL
  - key: user_profile
    label: 사용자 프로필
  aux_columns:
  - key: sync_roots
    label: 동기화 폴더 전체
  - key: account_type
    label: 계정 종류
  - key: recovery_method
    label: 복구 방법
  - key: source_locator
    label: 원본 위치
    format: mono
  rules:
  - cloud.sync_folder_outside_user_profile
- id: cloud-sync
  label: 클라우드 동기화 파일·이벤트
  types:
  - cloud-sync-file
  - cloud-sync-event
  kinds:
  - cloud-sync
  core_columns:
  # 시각: a file row's modified time (cloud-modified), an event row's own kind (cloud-upload …);
  # the cell chip reads the row's timestamp_kind.
  - key: timestamp
    label: 시각
    aliases:
    - modified_at
    format: time
    ts_kind: cloud-modified
    width: 170
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: actor
    semantic: account
    label: 계정
    aliases:
    - account
    - account_email
  - key: operation_label
    label: 활동
    aliases:
    - operation
  # Cloud-relative path (not a path on this evidence): no path tag.
  - key: item_path
    label: 항목 경로(클라우드 기준)
    aliases:
    - file_name
    format: path
  - key: size
    label: 크기
    format: bytes
  - key: sync_state
    label: 상태
    value_labels:
      parsed: 해석함
      partial-errors: 일부 원본 오류
      inventory-only: 인벤토리만
      executable-trace-only: 실행 흔적만
      trashed: 휴지통
      metadata: 메타데이터
      mirror: 로컬 미러
      removed: 삭제됨
      cloud-entry: 클라우드 항목
  - key: shared
    label: 공유 여부
  - key: sync_root
    semantic: path
    label: 동기화 폴더
    aliases:
    - sync_roots
    format: path
  - key: item_id
    label: 항목 ID
    format: mono
  aux_columns:
  - key: account_id
    semantic: account
    label: 계정 ID
    format: mono
  - key: deleted
    label: 삭제 상태
  - key: content_hash
    semantic: hash
    label: 콘텐츠 해시
    format: mono
  - key: recovery_method
    label: 복구 방법
  - key: source_locator
    label: 원본 위치
    format: mono
  - key: user_profile
    label: 사용자 프로필
  # R5 L3: Google Docs stubs (.gdoc …) and DriveFS google-apps items.
  - key: google_doc_type_label
    label: Google 문서 종류
    aliases:
    - google_doc_type
  - key: google_doc_url
    semantic: url
    label: Google 문서 URL
    format: url
  rules:
  - cloud.bulk_upload
- id: cloud-sync-inventory
  label: 클라우드 동기화 클라이언트 인벤토리
  types:
  - cloud-sync-inventory
  core_columns:
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: inventory_status
    label: 상태
    aliases:
    - sync_state
    value_labels:
      parsed: 해석함
      partial-errors: 일부 원본 오류
      inventory-only: 인벤토리만
      executable-trace-only: 실행 흔적만
      trashed: 휴지통
      metadata: 메타데이터
      mirror: 로컬 미러
      removed: 삭제됨
      cloud-entry: 클라우드 항목
  - key: inventory_reason
    label: 사유
    width: 380
  - key: file_count
    label: 파일 수
    format: number
  - key: total_bytes
    label: 전체 크기
    format: bytes
  - key: encrypted_store_count
    label: 암호화 저장소
    format: number
  - key: account
    semantic: account
    label: 계정
    aliases:
    - actor
  - key: sync_root
    label: 동기화 폴더
    format: path
  - key: user_profile
    label: 사용자 프로필
  aux_columns:
  - key: account_folder
    label: 계정 폴더
    format: path
  - key: source_locator
    label: 원본 위치
    format: mono
  - key: recovery_method
    label: 복구 방법
  - key: source_path
    label: 클라이언트 폴더
    format: path
  rules: []
rules:
- id: cloud.bulk_download
  family: cloud
  grade: B
  label_ko: 대량 다운로드·동기화
  rationale_ko: '한 계정의 다운로드/동기화가 짧은 시간에 임계값 이상: 대량 유출.'
  false_positive_ko: 초기 동기화, 신규 기기.
  sources: &id001
  - https://learn.microsoft.com/purview/audit-solutions-overview
  - https://exiftool.org/forum/index.php?msg=90811
  - https://support.apple.com/en-qa/108306
  version: 1
  status: verified
  params:
    window_minutes: 10
    min_count: 100
- id: cloud.external_share
  family: cloud
  grade: B
  label_ko: 외부·익명 공유 링크
  rationale_ko: '익명 링크·외부 공유 초대 생성: 유출 경로.'
  false_positive_ko: 정상 협업.
  sources: *id001
  version: 1
  status: verified
  params: {}
- id: cloud.new_device_login
  family: cloud
  grade: C
  label_ko: 처음 보는 기기·IP 로그인
  rationale_ko: '계정의 기준 로그인 이후 처음 나타난 IP/기기: 계정 탈취 또는 개인 기기.'
  false_positive_ko: VPN, 출장.
  sources: *id001
  version: 1
  status: provisional
  params:
    baseline_logins: 5
- id: cloud.delete_after_share
  family: cloud
  grade: B
  label_ko: 공유·다운로드 직후 삭제
  rationale_ko: '공유·다운로드한 항목을 한 시간 안에 삭제: 흔적 제거.'
  false_positive_ko: 정리.
  sources: *id001
  version: 1
  status: verified
  params:
    window_minutes: 60
- id: cloud.taken_vs_creation_gap
  family: cloud
  grade: C
  label_ko: 촬영·업로드 시각 차
  rationale_ko: 'Takeout photoTakenTime과 creationTime 차가 임계값 초과: 오래된 사진 업로드.'
  false_positive_ko: 사진 일괄 백업.
  sources: *id001
  version: 1
  status: verified
  params:
    max_gap_days: 30
- id: cloud.json_exif_gps_mismatch
  family: cloud
  grade: B
  label_ko: Takeout GPS와 EXIF GPS 불일치
  rationale_ko: 'Takeout geoData와 geoDataExif가 1 km 넘게 다름: 위치 편집 정황.'
  false_positive_ko: 앱의 위치 수정 기능.
  sources: *id001
  version: 1
  status: verified
  params:
    max_distance_km: 1.0
- id: cloud.audit_retention_gap
  family: cloud
  grade: C
  label_ko: 감사 보존기간 한계
  rationale_ko: '서비스별 가장 이른 감사 기록: 그 이전은 보존기간 밖일 수 있어 부재 ≠ 미발생.'
  false_positive_ko: 해당 없음(한계 표기).
  sources: *id001
  version: 1
  status: verified
  params:
    retention_days: 180
- id: cloud.bulk_upload
  family: cloud-sync
  grade: A
  label_ko: 대량 업로드
  rationale_ko: '한 계정의 서로 다른 항목 업로드가 1시간 안에 50건 이상이거나, 서로 다른 항목 2건 이상의 합계가 500 MB 이상: 개인 클라우드로 대량 반출. 같은 항목의 재업로드는 한 번만 셈. 로그 카빙 레코드만으로 된 구간은 B 등급(메모 표시).'
  false_positive_ko: 최초 동기화·새 PC 설정, 사진·백업 폴더 자동 업로드, 같은 파일의 반복 동기화.
  sources:
  - https://learn.microsoft.com/purview/audit-log-activities
  - https://github.com/ydkhatri/OneDrive
  - https://help.dropbox.com/installs/sync-overview
  version: 2
  status: provisional
  params:
    window_minutes: 60
    min_count: 50
    min_bytes: 500000000
- id: cloud.sync_folder_outside_user_profile
  family: cloud-sync
  grade: C
  label_ko: 사용자 프로필 밖 동기화 폴더
  rationale_ko: '동기화 클라이언트의 동기화 폴더가 C:\Users\<사용자> 밖(다른 드라이브·이동식 디스크·공용 폴더)에 있음: 반출용 경로 구성 정황.'
  false_positive_ko: 데이터 드라이브(D:)에 의도적으로 둔 경우, 회사 정책상 위치 변경.
  sources:
  - https://learn.microsoft.com/sharepoint/use-group-policy
  - https://help.dropbox.com/installs/move-dropbox-folder
  - https://support.google.com/drive/answer/10838124
  version: 1
  status: provisional
  params: {}
