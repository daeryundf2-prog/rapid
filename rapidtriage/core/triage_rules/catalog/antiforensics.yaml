# Triage catalogue: anti-forensics (plan r3-os-depth-2026-10-17 §3.1 O1; research axiom-parity-matrix §4 gap 9)
# The tool signature list lives in the rule params below (one entry per tool, each with its source URL).
families:
- id: antiforensics
  label: 안티 포렌식(BitLocker 복구 키 파일)
  types:
  - bitlocker-recovery-key-file
  core_columns:
  - key: key_created_at
    label: 키 생성(.BEK)
    aliases:
    - timestamp
    format: time
    ts_kind: created
  - key: file_name
    label: 파일 이름
  - key: key_file_kind_label
    label: 파일 종류
    aliases:
    - key_file_kind
  - key: key_identifier
    label: 키 식별자
    format: mono
  - key: key_masked
    label: 복구 키(가림)
    format: mono
  - key: key_format_valid
    label: 키 형식 검증
    value_labels:
      'true': 유효
      'false': 유효하지 않음
  - key: key_sha256
    semantic: hash
    label: 키 SHA-256
    format: mono
  - key: identifier_matches_file_name
    label: 파일 이름 식별자 일치
    value_labels:
      'true': 일치
      'false': 불일치
  - key: source_path
    semantic: path
    label: 파일 경로
    aliases:
    - path
    format: path
  aux_columns:
  - key: key_count
    label: 키 수
    format: number
  - key: key_value_stored
    label: 키 값 저장 여부
  - key: language
    label: 언어
  - key: size
    label: 파일 크기
    format: bytes
  - key: evidence_note
    label: 참고
  rules:
  - antiforensics.tool_present
  - antiforensics.wiper_run_after_incident
# --- R5 L2: virtual machines, crypto wallet presence (no keys/seeds), McAfee detection logs ------
