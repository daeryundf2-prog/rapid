# R6 S2 lane A (plan r6-followups-2026-10-19 §2.3 갈래 A): AhnLab product folders, log candidates and
# quarantine folders (counts only, contents never opened). Inventory layer; no rule reads it.
- id: av-product-presence
  label: 백신 제품 흔적
  types:
  - av-product-presence
  core_columns:
  - key: presence_kind_label
    label: 항목
    aliases:
    - presence_kind
  - key: av_product_label
    label: 제품
    aliases:
    - av_product
  - key: product_version
    label: 버전(version*.ini)
  - key: source_path
    semantic: path
    label: 위치
    format: path
  - key: sniffed_format_label
    label: 파일 형식(추정)
    aliases:
    - sniffed_format
  - key: parse_outcome
    label: 해석 결과
    value_labels:
      detection-rows: 탐지 행 있음
      no-detection-lines: 탐지 줄 없음
      no-detection-rows: 탐지 행 없음
      no-detection-table: 탐지 표 없음
      inventory-only: 목록만(형식 미지원)
      skipped-size-cap: 크기 상한 초과
      error: 해석 오류
  - key: file_count
    label: 파일 수
    format: number
  - key: total_size
    label: 전체 크기
    format: bytes
  - key: user
    semantic: account
    label: 사용자 프로필
  aux_columns:
  - key: install_scope_label
    label: 설치 위치
    aliases:
    - install_scope
  - key: product_folder_name
    label: 제품 폴더
  - key: relative_path
    label: 폴더 안 경로
    format: path
  - key: file_size
    label: 크기
    format: bytes
  - key: source_file_mtime
    label: 파일 수정(사본 기준)
    format: time
    ts_kind: modified
  - key: detection_row_count
    label: 탐지 행 수
    format: number
  - key: log_candidate_count
    label: 로그 후보 수
    format: number
  - key: quarantine_file_count
    label: 격리 파일 수
    format: number
  - key: contents_opened
    label: 내용 열람
    value_labels:
      'false': 아니요(정책)
  - key: verification
    label: 형식 검증
    value_labels:
      unconfirmed: 미확인(실표본 검증 전)
      confirmed: 확인됨
  - key: evidence_note
    label: 참고
  rules: []
rules:
- id: antiforensics.tool_present
  family: antiforensics
  grade: B
  label_ko: 안티 포렌식·암호화 도구 흔적
  rationale_ko: '설치 프로그램·App Paths·Prefetch·Amcache·BAM·PCA·서비스·파일 이름·명령줄에 증거 인멸(삭제·와이프·타임스톰핑)이나 디스크 암호화 도구가 있음: 출처가 명시된 시그니처 목록과 정확히 일치(제품명은 단어 경계, 실행 파일은 파일 이름 전체).'
  false_positive_ko: 정상 업무용 암호화(회사 정책 VeraCrypt), 일상 정리용 CCleaner. 이름에 cleaner가 들어간 무관한 앱은 일치하지 않음. Windows 구성 요소(cipher.exe·BitLocker 마법사)는 명령줄(/w)이나 실행 흔적에서만 확인.
  sources: &af_sources
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1070/006/
  - https://attack.mitre.org/techniques/T1485/
  - https://attack.mitre.org/techniques/T1561/
  - https://www.sans.org/blog/digital-forensics-application-execution/
  version: 1
  status: provisional
  params:
    signatures: &af_signatures
    - id: veracrypt
      name: VeraCrypt
      category: encryption
      products:
      - \bveracrypt\b
      - 베라크립트
      executables:
      - veracrypt.exe
      - veracrypt-x64.exe
      - veracrypt-arm64.exe
      - veracrypt format.exe
      - veracrypt format-x64.exe
      - veracryptexpander.exe
      - veracrypt setup.exe
      services:
      - veracrypt
      source: https://www.veracrypt.fr/en/Home.html
    - id: truecrypt
      name: TrueCrypt
      category: encryption
      products:
      - \btruecrypt\b
      - 트루크립트
      executables:
      - truecrypt.exe
      - truecrypt format.exe
      - truecrypt setup.exe
      services:
      - truecrypt
      source: https://truecrypt.sourceforge.net/
    - id: bitlocker-to-go
      name: BitLocker(드라이브 암호화 마법사·To Go)
      category: encryption
      builtin: true
      executables:
      - bitlockerwizard.exe
      - bitlockerwizardelev.exe
      - bitlockertogo.exe
      commands:
      - \bmanage-bde(?:\.exe)?\s+-(?:on|protectors\s+-add)\b
      source: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/
    - id: ccleaner
      name: CCleaner
      category: cleaner
      products:
      - \bccleaner\b
      - 씨클리너
      executables:
      - ccleaner.exe
      - ccleaner64.exe
      - ccleanerbrowser.exe
      services:
      - ccleanerperformanceoptimizerservice
      source: https://www.ccleaner.com/ccleaner
    - id: bleachbit
      name: BleachBit
      category: cleaner
      products:
      - \bbleachbit\b
      - 블리치비트
      executables:
      - bleachbit.exe
      - bleachbit_console.exe
      source: https://www.bleachbit.org/
    - id: eraser
      name: Eraser
      category: wiper
      products:
      - ^eraser(?:\s+\d|\s*$)
      executables:
      - eraser.exe
      services:
      - eraser
      source: https://eraser.heidi.ie/
    - id: sdelete
      name: SDelete(Sysinternals)
      category: wiper
      executables:
      - sdelete.exe
      - sdelete64.exe
      - sdelete64a.exe
      commands:
      - \bsdelete(?:64a?)?(?:\.exe)?\s
      source: https://learn.microsoft.com/en-us/sysinternals/downloads/sdelete
    - id: cipher-wipe
      name: cipher /w(빈 공간 덮어쓰기)
      category: wiper
      builtin: true
      commands:
      - \bcipher(?:\.exe)?\s+(?:/[a-z]+\s+)*/w\b
      source: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cipher
    - id: privazer
      name: PrivaZer
      category: cleaner
      products:
      - \bprivazer\b
      executables:
      - privazer.exe
      source: https://privazer.com/en/
    - id: wise-disk-cleaner
      name: Wise Disk Cleaner
      category: cleaner
      products:
      - \bwise disk cleaner\b
      executables:
      - wisediskcleaner.exe
      source: https://www.wisecleaner.com/wise-disk-cleaner.html
    - id: timestomp
      name: timestomp(Metasploit)
      category: timestomp
      executables:
      - timestomp.exe
      commands:
      - \btimestomp(?:\.exe)?\s
      source: https://attack.mitre.org/techniques/T1070/006/
    - id: setmace
      name: SetMACE
      category: timestomp
      executables:
      - setmace.exe
      - setmace64.exe
      source: https://github.com/jschicht/SetMace
    - id: dban
      name: DBAN(Darik's Boot and Nuke)
      category: wiper
      products:
      - \bdarik'?s boot and nuke\b
      - \bdban\b
      executables:
      - dban.exe
      source: https://dban.org/
    - id: killdisk
      name: KillDisk
      category: wiper
      products:
      - \bkilldisk\b
      executables:
      - killdisk.exe
      - killdiskwin.exe
      - killdisk_win.exe
      source: https://www.killdisk.com/
- id: antiforensics.wiper_run_after_incident
  family: antiforensics
  grade: A
  label_ko: 사건 이후 와이퍼·정리 도구 실행
  rationale_ko: '와이퍼·정리·타임스톰핑 도구(시그니처 목록)의 실행 시각(Prefetch 실행 8회·BAM·UserAssist·PCA·4688 명령줄)이 사건 시작 이후(종료가 있으면 종료 + 유예 일수까지): 증거 인멸 정황(사건 시간대를 지정해야 동작).'
  false_positive_ko: 정기 정리 작업(예약 실행), 사건과 무관한 일상 정리. 설치 흔적만 있고 실행 시각이 없는 행은 제외.
  sources: *af_sources
  version: 1
  status: provisional
  params:
    signatures: *af_signatures
    categories:
    - wiper
    - cleaner
    - timestomp
    incident_start: null
    incident_end: null
    grace_days: 30
- id: antiforensics.crypto_wallet_present
  family: crypto-wallet
  grade: C
  label_ko: 암호화폐 지갑 존재
  rationale_ko: '데스크톱 지갑(Bitcoin Core·Electrum·Exodus·Ledger Live 등), wallet.dat 파일 또는 브라우저 확장 지갑(MetaMask·Phantom·Kaikas 등)의 저장소에 데이터가 있음: 자금 추적의 출발점(키·시드는 정책상 읽지 않음).'
  false_positive_ko: 확장만 설치하고 쓰지 않은 빈 폴더는 표시하지 않음. 업무용 지갑·테스트넷 지갑도 같은 흔적을 남김.
  sources:
  - https://en.bitcoin.it/wiki/Data_directory
  - https://electrum.readthedocs.io/en/latest/faq.html
  - https://chromewebstore.google.com/detail/metamask/nkbihfbeogaeaoehlefnkodbefgpgknn
  version: 1
  status: provisional
  params: {}
- id: antiforensics.vm_present
  family: vm-config
  grade: C
  label_ko: 가상 머신 구성 존재
  rationale_ko: 'VMware(.vmx·preferences.ini·inventory.vmls)·VirtualBox(.vbox·VirtualBox.xml)·Hyper-V(.vmcx) 가상 머신 정의가 있음: 가상 머신 안에서 작업해 호스트 흔적을 줄였을 가능성(공유 폴더·디스크 경로 확인).'
  false_positive_ko: 개발·테스트용 VM, Docker Desktop·WSL·Windows Sandbox 같은 유틸리티 VM(이름 표지로 제외).
  sources:
  - https://attack.mitre.org/techniques/T1564/006/
  - https://www.virtualbox.org/manual/
  version: 1
  status: provisional
  params:
    ignore_name_markers:
    - dockerdesktopvm
    - docker-desktop
    - wslvm
    - windows sandbox
