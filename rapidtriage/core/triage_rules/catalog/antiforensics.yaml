    label: 탐지 시각(현지)
    aliases:
    - timestamp
    format: time
    ts_kind: event
  - key: av_product_label
    label: 제품
    aliases:
    - av_product
  - key: action_label
    label: 조치
    aliases:
    - action
  - key: threat_name
    label: 위협 이름
  - key: object_path
    semantic: path
    label: 대상 파일
    format: path
  - key: process_path
    semantic: path
    label: 프로세스
    format: path
  - key: account
    semantic: account
    label: 계정
  - key: log_name
    label: 로그 파일
  aux_columns:
  - key: message
    label: 원문
    format: mono
