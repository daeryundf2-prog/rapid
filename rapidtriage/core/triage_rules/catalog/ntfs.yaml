rules:
- id: ntfs.si_before_fn
  family: mft
  grade: A
  label_ko: $SI 생성 < $FN 생성(타임스톰핑)
  rationale_ko: '$STANDARD_INFORMATION 생성 시각이 $FILE_NAME 생성 시각보다 임계값 이상 앞서고 타임스톰핑 보강 근거가 있을 때만 A: ① $SI 생성·수정·MFT 수정이 모두 초 미만 0인데 $FN 생성은 아님(초 단위 SetFileTime·타임스톰핑 도구), ② $SI 수정·MFT 수정도 $FN 생성보다 임계값 이상 앞섬(이름이 생길 때 NTFS가 $SI MFT 수정을 갱신하므로 $SI 시각을 모두 되돌리는 도구만 남기는 모양). 보강 근거 없이 사용자 쓰기 가능 경로의 실행·스크립트 파일이면 B, 그 밖은 C. 보강 근거가 없고 $FN 생성이 같은 시간 구간(bulk_bucket_seconds)에 bulk_min_records건 이상 몰렸거나 서비싱 경로(WinSxS·servicing·SoftwareDistribution)면 표시하지 않음(보강 근거가 있으면 대량이어도 표시).'
  false_positive_ko: '시각을 보존하는 복사·압축 해제·설치기·Windows 기능 업데이트(BSH 전체 $MFT에서 단순 $SI<$FN 174,854건, 87%가 8일에 몰림 — 대부분 2025-02-21·23 기능 업데이트). 초 미만 0은 압축(ZIP 2초 단위) 해제에서도 생기지만 그때 $SI MFT 수정은 해제 시각이라 ①에 걸리지 않음. 시각이 마이크로초로 잘려 있어 100ns 1~9틱만 있는 값은 0으로 읽힘(드묾). 정상 이동·하드 링크도 ②를 남길 수 있어 A는 검토 대상이지 판단이 아님.'
  sources:
  - https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html
  - https://attack.mitre.org/techniques/T1070/006/
  - https://learn.microsoft.com/en-us/windows/win32/api/fileapi/nf-fileapi-setfiletime
  - https://opus.bibliothek.uni-augsburg.de/opus4/117569
  - https://www.sans.org/blog/ntfs-i30-index-attributes-evidence-of-deleted-and-overwritten-files/
  version: 2
  status: verified
  validation:
    synthetic: true
    real:
    - source: BSH 전체 이미지 $MFT(버전 1, ntfs-meta source=mft, 1,421,896 레코드)
      hits: 174852
      false_positives: 10
      checked_at: '2026-10-21'
      note_ko: '버전 1(보강 근거 없이 A): 174,852건 적중(파일 156,999·디렉터리 17,855, 사용 중 93,010·삭제 81,844), 무작위 표본 10건 모두 시각 보존 복사·압축 해제·서비싱(오탐), 3건 수동 확인($SI<$FN 자체는 사실). 분석 자체 수 174,854와의 2건 차이는 $SI 1970-01-02인 IME 파일 2개를 1971년 하한으로 버린 것(버전 2에서 수정).'
    - source: BSH 전체 이미지 $MFT(버전 2 재측정)
      hits: 8970
      checked_at: '2026-10-21'
      note_ko: '버전 2: 후보 174,854건(분석 자체 수와 일치) 중 8,970건 표시 — A 2·B 202·C 8,766, 165,884건은 대량(같은 시간 500건 이상)·서비싱 경로라 미표시. A 2건(AhnLab DLL: $SI MFT 수정도 $FN보다 2년 앞섬 / 루트의 삭제된 GUID 이름 파일: $SI 네 시각이 같은 초 미만 0)은 이상 모양은 맞으나 조작 여부 미확정(내용·USN 없음). B 202건은 사용자 폴더 설치기·추가 기능 압축 해제(검토상 정상).'
    public: []
    notes_ko: '실데이터 1건(BSH 전체 $MFT): 버전 1은 오탐 폭주라 보강 근거·대량·서비싱 조건으로 재설계(버전 2). 타임스톰핑 양성 실데이터는 아직 없음(공개 데이터셋·VM 승인 대기).'
  params:
    min_delta_seconds: 60
    bulk_min_records: 500
    bulk_bucket_seconds: 3600
    suppress_path_markers:
    - \windows\winsxs\
    - \windows\servicing\
    - \windows\softwaredistribution\
    executable_extensions: [exe, dll, sys, scr, com, pif, cpl, msi, bat, cmd, ps1, psm1, vbs, vbe, js, jse, wsf, hta, jar, lnk]
- id: ntfs.zero_subsecond
  family: mft
  grade: C
  label_ko: $SI 초 미만 0
  rationale_ko: '$SI 생성·수정의 초 미만이 0인데 $FN은 아님: 초 단위로만 쓰는 시각 조작 도구(약한 지표).'
  false_positive_ko: 일부 정상 SW, FAT에서 복사된 파일.
  sources: &id001
  - https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html
  - https://opus.bibliothek.uni-augsburg.de/opus4/117569
  - https://andreafortuna.org/2017/10/18/windows-forensics-usn-journal/
  - https://www.sans.org/blog/ntfs-i30-index-attributes-evidence-of-deleted-and-overwritten-files/
  - https://andreafortuna.org/2019/09/26/windows-forensics-analysis-of-recycle-bin-artifacts/
  version: 1
  status: verified
  params: {}
- id: ntfs.fn_manipulation
  family: mft
  grade: B
  label_ko: $FN 시각 조작 의심
  rationale_ko: 'USN RENAME_NEW_NAME 이후에도 $FN 변경 시각이 이름 변경보다 앞섬: 고급 타임스톰핑.'
  false_positive_ko: 정상 이동, USN 보존 범위.
  sources: *id001
  version: 1
  status: provisional
  params:
    tolerance_seconds: 2
- id: ntfs.usn_basic_info_change
  family: mft
  grade: B
  label_ko: BASIC_INFO_CHANGE 뒤 과거 $SI
  rationale_ko: 'USN BASIC_INFO_CHANGE 시점보다 $SI 수정 시각이 하루 이상 과거: 조작 시점 단서. 속성 변경도 같은 플래그라 단독 판단 금지.'
  false_positive_ko: 속성 변경, 압축 해제·복원.
  sources: *id001
  version: 1
  status: verified
  params:
    backdate_days: 1
- id: ntfs.time_inversion
  family: mft
  grade: C
  label_ko: $SI 수정 < 생성
  rationale_ko: '$SI 수정 시각이 생성 시각보다 앞섬: 복사 또는 조작.'
  false_positive_ko: 복사된 파일은 정상적으로 이런 모양.
  sources: *id001
  version: 1
  status: verified
  params: {}
- id: ntfs.ads_executable
  family: zone
  grade: A
  label_ko: 실행 파일 ADS
  rationale_ko: 'Zone.Identifier가 아닌 대체 데이터 스트림의 내용이 PE(MZ): 은닉 페이로드.'
  false_positive_ko: 일부 보안 제품의 태그 스트림.
  sources: *id001
  version: 1
  status: verified
  validation:
    synthetic: true
    real:
    - source: BSH 전체 이미지 $MFT(해당 없음 — ADS 행 없음)
      hits: 0
      checked_at: '2026-10-21'
