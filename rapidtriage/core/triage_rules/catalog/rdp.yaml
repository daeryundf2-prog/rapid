# Triage catalogue: rdp (plan viewer-families-2026-10-15; research docs/research/forensic-field-catalog-*.md)
families:
- id: rdp
  label: 원격 데스크톱
  types: []
  prefixes:
  - rdp-
  core_columns:
  - key: key_last_written_at
    label: 마지막 기록
    aliases:
    - last_written_at
    - timestamp
    - modified_at
    format: time
    ts_kind: last-written
  - key: destination
    semantic: device
    label: 대상 서버
    aliases:
    - server
    - host
    - address
    format: mono
  - key: username_hint
    semantic: account
    label: 사용자 이름
    aliases:
    - user_name
    - username
  - key: mru_position
    label: MRU 순서
    aliases:
    - mru_index
    format: number
  - key: user
    semantic: account
    label: 사용자 프로필
    aliases:
    - user_hive_scope
  - key: direction
    label: 방향
    derive: rdp_direction
  aux_columns: []
  rules: []
