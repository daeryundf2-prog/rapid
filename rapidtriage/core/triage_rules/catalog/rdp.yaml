rules:
- id: rdp.external_ip
  family: eventlog-event
  grade: A
  label_ko: 외부 IP RDP 연결(1149/131)
  rationale_ko: 'RemoteConnectionManager 1149 또는 RdpCoreTS 131의 클라이언트 주소가 공인 IP: 인터넷 노출 RDP.'
  false_positive_ko: VPN 게이트웨이 주소.
  sources: &id001
  - https://frsecure.com/blog/rdp-connection-event-logs/
  - https://www.magnetforensics.com/blog/rdp-artifacts-in-incident-response/
  - https://andreafortuna.org/2019/03/27/remote-desktop-connections-forensics/
  - https://www.cybertriage.com/?p=26680
  version: 1
  status: verified
  params: {}
- id: rdp.pairing_mismatch
  family: eventlog-event
  grade: C
  label_ko: RDP 인증·세션 짝 불일치
  rationale_ko: '1149(네트워크 인증) 뒤 세션 로그온(21)이 없거나, 원격 21 앞에 1149가 없음: NLA 단계에서 멈춘 시도와 실제 세션 구분.'
  false_positive_ko: NLA 실패, 스캔, 로그 보존 기간 차이.
  sources: *id001
  version: 1
  status: verified
  params:
    window_seconds: 120
- id: rdp.session_hijack
  family: eventlog-event
  grade: B
  label_ko: RDP 세션 재연결 주소 불일치
  rationale_ko: '4778/LSM 25 재연결 주소가 그 계정의 직전 RDP 로그온 주소와 다름: 세션 탈취 가능성.'
  false_positive_ko: 사용자가 다른 장소에서 재접속.
  sources: *id001
  version: 1
  status: provisional
  params: {}
- id: rdp.outbound
  family: eventlog-event
  grade: B
  label_ko: 아웃바운드 RDP(1024 + 4648)
  rationale_ko: '원격 데스크톱 클라이언트 1024와 가까운 시각의 4648: 이 PC가 다른 호스트로 접속한 횡이동 출발지.'
  false_positive_ko: 관리자의 정상 원격 접속.
  sources: *id001
  version: 1
  status: verified
  params:
    window_minutes: 5
- id: rdp.enabled
  family: eventlog-event
  grade: B
  label_ko: RDP 활성화(fDenyTSConnections=0)
  rationale_ko: 'fDenyTSConnections 값을 0으로 설정(Sysmon 13 또는 레지스트리 값): 공격자의 RDP 활성화.'
  false_positive_ko: 정상 원격 지원 구성.
  sources: *id001
  version: 1
  status: provisional
  params: {}
- id: rdp.multi_host
  family: eventlog-event
  grade: B
  label_ko: 한 계정의 다수 호스트 RDP
  rationale_ko: '같은 계정이 짧은 시간 안에 여러 컴퓨터에 유형 10 로그온: 횡이동.'
  false_positive_ko: 점프 서버, 운영 관리자.
  sources: *id001
  version: 1
  status: verified
  params:
    window_minutes: 60
    min_hosts: 3
