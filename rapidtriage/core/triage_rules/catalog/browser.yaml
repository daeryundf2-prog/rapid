- id: browser-cache-entry
  label: 브라우저 캐시 항목
  types:
  - browser-cache-entry
  # 시각: the response time, else the entry's created / last-used / stored time — the cell
  # chip reads the row's own timestamp_kind (cache-response · cache-created · cache-last-used).
  # 주소 enters 통합 보기 › URL only for POST entries (uploads); every cached GET resource
  # would drown the table (the file name candidate column still feeds 첨부).
  core_columns:
  - key: timestamp
    label: 시각
    format: time
    ts_kind: cache-response
  - key: url
    semantic: url
    semantic_when:
      method:
      - POST
    label: 주소 (URL)
    format: url
  - key: http_status
    label: 응답 상태
    format: number
  - key: content_type
    label: 콘텐츠 형식 (Content-Type)
  - key: body_size
    label: 크기
    aliases:
    - content_length
    format: bytes
  - key: body_sha256
    semantic: hash
    label: 본문 SHA-256
    aliases:
    - body_prefix_sha256
    format: mono
  - key: host
    label: 호스트
  - key: method
    label: 요청 방식
  - key: file_name_candidate
    semantic: attachment
    label: 파일 이름 후보 (Content-Disposition)
  - key: cache_format
    label: 캐시 형식
    value_labels:
      chromium-simple: Chromium 단순 캐시
      chromium-blockfile: Chromium 블록 파일 캐시
      chromium-cachestorage: Chromium CacheStorage
      webcache-content: WebCache Content(IE·레거시 Edge)
  - key: browser
    label: 브라우저
    value_labels:
      ie-edge-legacy: IE·레거시 Edge(WebCache)
  - key: profile
    label: 프로필
  aux_columns:
  - key: content_length
    label: 콘텐츠 길이 (Content-Length)
    format: bytes
  - key: compression
    label: 압축
    aliases:
    - content_encoding
  - key: request_time
    label: 요청 시각
    format: time
    ts_kind: cache-request
  - key: created_at
    label: 항목 생성
    format: time
    ts_kind: created
  - key: last_used_at
    label: 마지막 사용
    format: time
    ts_kind: last-used
  - key: body_signature
    label: 본문 서명(앞 256바이트)
  - key: body_hash_scope
    label: 본문 해시 범위
  - key: body_status
    label: 본문 상태
  - key: headers_status
    label: 헤더 상태
  - key: entry_state
    label: 항목 상태
  - key: server
    label: 서버
  - key: location
    semantic: url
    label: 이동 주소 (Location)
    format: url
  - key: cache_key
    label: 캐시 키
    format: mono
  - key: source_offset
    label: 원본 오프셋
    format: number
  - key: recovery_method
    label: 복구 방식
  - key: webcache_container
    label: WebCache 컨테이너
  - key: user
    semantic: account
    label: 사용자
  rules: []
- id: web-upload-candidate
