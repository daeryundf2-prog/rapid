    - url_class
  - key: source_kind_label
    label: 소스 종류
    aliases:
    - source_kind
  - key: source_path
    label: 원본(소스) 경로
    format: path
  - key: offset
    label: 오프셋
    aliases:
    - source_offset
    format: hex
  - key: encoding
    label: 인코딩
    value_labels:
      ascii: ASCII
      utf-16le: UTF-16LE
  - key: hit_count
    label: 출현 수(이 소스)
    format: number
  - key: host
    label: 호스트
  aux_columns:
  - key: latitude
    semantic: geo
    label: 위도(지도 URL)
    format: number
  - key: longitude
    label: 경도(지도 URL)
    format: number
  - key: url_sha256
    label: 원본 URL SHA-256
    format: mono
  - key: url_tokens_redacted
    label: 토큰 가림
  - key: url_truncated
    label: URL 잘림
  - key: recovery_method
    label: 복구 방법
    value_labels:
      carved-url: URL 카빙
  rules: []
rules:
- id: browser.dl_from_filesharing
  family: browser-download
  grade: B
  label_ko: 파일 공유 사이트 다운로드
  rationale_ko: '다운로드 URL·탭 URL·참조가 파일 공유/일회용 전송 도메인: 유출·악성 반입.'
  false_positive_ko: 업무용 클라우드.
  sources: &id001
  - https://forensics.wiki/mozilla_firefox/
  - https://sleuthkit.org/autopsy/docs/api-docs/4.19.0/_firefox_8java_source.html
  - https://developer.chrome.com/docs/extensions/declare_permissions
  - https://research.chalmers.se/publication/521711
  - https://docs.velociraptor.app/exchange/artifacts/pages/detection.application.cursedchrome/
  version: 1
  status: verified
  params:
    share_domains: &id002
    - mega.nz
    - mega.io
    - wetransfer.com
    - we.tl
    - dropbox.com
    - drive.google.com
    - docs.google.com
    - mediafire.com
    - sendspace.com
    - file.io
    - transfer.sh
    - gofile.io
    - pixeldrain.com
    - anonfiles.com
    - zippyshare.com
    - 4shared.com
    - 1drv.ms
    - onedrive.live.com
    - box.com
    - pcloud.com
    - filemail.com
    - send.vis.ee
    - catbox.moe
    - tmpfiles.org
    - mydrive.naver.com
    - ndrive.naver.com
    - mybox.naver.com
    - cloud.kakao.com
    - transfer.it
- id: browser.dl_dangerous
  family: browser-download
  grade: B
  label_ko: 위험 판정 다운로드
  rationale_ko: '다운로드 danger_type이 확정 위험(DANGEROUS_FILE/URL/CONTENT/HOST, POTENTIALLY_UNWANTED, USER_VALIDATED 등)이거나, 약한 판정(MAYBE_DANGEROUS_CONTENT/UNCOMMON_CONTENT)인데 대상이 실행·스크립트 파일: 브라우저 보호 기능 경고.'
  false_positive_ko: 흔치 않은 문서(PDF/HWP/XLSX)나 서명된 보안 플러그인 설치 파일도 약한 판정을 받음(문서는 제외, 실행 파일은 남음). 오래된 값 의미 변화.
  sources: *id001
  version: 2
  status: provisional
  params:
    strong_types:
    - DANGEROUS_FILE
    - DANGEROUS_URL
    - DANGEROUS_CONTENT
    - USER_VALIDATED
    - DANGEROUS_HOST
    - POTENTIALLY_UNWANTED
    - DEEP_SCANNED_OPENED_DANGEROUS
    - DANGEROUS_ACCOUNT_COMPROMISE
    weak_types:
    - MAYBE_DANGEROUS_CONTENT
    - UNCOMMON_CONTENT
    exec_extensions:
    - exe
    - msi
    - scr
    - com
    - pif
    - cpl
    - dll
    - js
    - jse
    - vbs
    - vbe
    - wsf
    - ps1
    - bat
    - cmd
    - hta
    - jar
    - lnk
    - iso
    - img
    - vhd
    - vhdx
    - apk
- id: browser.dl_missing_file
  family: browser-download
  grade: C
  label_ko: 다운로드 파일 없음
  rationale_ko: '다운로드 대상 경로가 같은 폴더의 다른 파일은 있는데 목록에 없음: 삭제·이동.'
  false_positive_ko: 이동·정리.
  sources: *id001
  version: 1
  status: verified
  params: {}
- id: browser.incognito_gap
  family: browser-history
  grade: C
  label_ko: 방문 기록 공백(시크릿/삭제)
  rationale_ko: '이벤트·Prefetch 활동은 있는 날이 연속되는데 방문 기록이 비어 있음: 시크릿 모드·기록 삭제.'
  false_positive_ko: 단순 비활성, 다른 브라우저 사용.
  sources: *id001
  version: 1
  status: provisional
  params:
    min_activity_events: 50
    min_gap_days: 3
- id: browser.history_cleared
  family: browser-history
  grade: C
  label_ko: 방문 기록 앞부분 삭제
  rationale_ko: '남은 기록의 가장 작은 행 id가 임계값보다 큼: 앞부분 기록 삭제.'
  false_positive_ko: 자동 만료(보관기간).
  sources: *id001
  version: 1
  status: provisional
  params:
    min_first_id: 1000
- id: browser.ext_broad_perm
  family: browser-extension
  grade: B
  label_ko: 전체 트래픽 열람 확장
  rationale_ko: '확장이 <all_urls>류 호스트 권한과 webRequest를 함께 가짐: 전체 트래픽 열람.'
  false_positive_ko: 광고 차단·번역기 등 합법 확장.
  sources: *id001
  version: 1
  status: verified
  params: {}
- id: browser.ext_sideloaded
  family: browser-extension
  grade: C
  label_ko: 스토어 밖 설치 확장
  rationale_ko: '웹 스토어 설치도 기본 설치도 아닌 확장: 악성 확장·정책 위반. Secure Preferences HMAC은 우회 가능해 무결성 증거 아님.'
  false_positive_ko: 개발자 확장.
  sources: *id001
  version: 1
  status: verified
  params: {}
- id: browser.search_sensitive
  family: browser-search
  grade: B
  label_ko: 사건 관련 검색어
  rationale_ko: '검색어가 사건 키워드(삭제 방법·와이핑·해외 송금 등): 의도 정황.'
  false_positive_ko: 일반 정보 검색.
  sources: *id001
  version: 1
  status: verified
  params:
    keywords: &id003
    - 삭제 방법
    - 영구 삭제
    - 복구 불가
    - 포맷 방법
    - 디가우징
    - 와이핑
    - 증거 인멸
    - 안티포렌식
    - 기록 삭제
    - 해외 송금
    - 차명 계좌
    - wipe
    - shred
    - eraser
    - ccleaner
    - bleachbit
    - secure delete
    - anti forensic
    - anti-forensic
    - delete history
    - clear event log
- id: browser.cred_first_use_new_site
  family: browser-login
  grade: C
  label_ko: 사건 직전 저장된 로그인
  rationale_ko: '저장된 로그인 생성 시각이 지정한 사건 시간대 안: 신규 계정 사용(사건 시간대를 지정해야 동작).'
  false_positive_ko: 정상 사용.
  sources: *id001
  version: 1
  status: verified
  params: {}
- id: browser.typed_url_direct
  family: browser-visit
  grade: C
  label_ko: 주소창 직접 입력한 민감 URL
  rationale_ko: '직접 입력(typed) 전이로 파일 공유 사이트나 사건 키워드가 든 URL 방문: 사전 인지.'
  false_positive_ko: 즐겨찾기·자동완성.
  sources: *id001
  version: 1
  status: verified
  params:
    share_domains: *id002
    keywords: *id003
- id: browser.webmail_upload
  family: web-upload-candidate
  grade: B
  label_ko: 웹메일 첨부 업로드 후보
  rationale_ko: '캐시 항목·방문 기록 URL이 웹메일(네이버·다음·Gmail·Outlook 웹) 첨부 업로드 경로이거나 그 호스트로 간 POST 요청: 웹메일을 통한 파일 유출 경로.'
  false_positive_ko: 업무 메일 첨부·첨부 열람(약한 근거 attid는 기본 제외). URL은 업로드 흐름의 흔적일 뿐 어떤 파일이 나갔는지는 다른 증거로 확인.
  sources: &id004
  - https://developers.google.com/gmail/api/reference/rest/v1/users.messages.attachments/get
  - https://learn.microsoft.com/en-us/exchange/client-developer/web-service-reference/createattachment-operation
  - https://developers.google.com/drive/api/guides/manage-uploads
  - https://www.dropbox.com/developers/documentation/http/documentation
  - https://learn.microsoft.com/en-us/onedrive/developer/rest-api/api/driveitem-createuploadsession
  - https://chromium.googlesource.com/chromium/src/+/HEAD/net/disk_cache/simple/simple_entry_format.h
  version: 1
  status: provisional
  params:
    min_strength: medium
- id: browser.filesharing_upload
  family: web-upload-candidate
  grade: B
  label_ko: 파일 공유·웹하드·클라우드 업로드 후보
  rationale_ko: '캐시 항목·방문 기록 URL이 파일 공유(WeTransfer·Send Anywhere·MEGA)·웹하드·개인 클라우드(Google Drive·Dropbox·OneDrive·MYBOX) 업로드 엔드포인트이거나 그 호스트로 간 POST 요청: 외부 저장소로의 유출 경로.'
  false_positive_ko: 업무용 클라우드·사내 승인 파일 전송. URL은 업로드 흐름의 흔적일 뿐 어떤 파일이 나갔는지는 다른 증거로 확인.
  sources: *id004
  version: 1
  status: provisional
  params:
    min_strength: medium
    categories:
    - filesharing
    - cloud
- id: browser.torrent_site_visit
  family: browser-visit
  grade: C
  label_ko: 토렌트 사이트·magnet 링크 방문
  rationale_ko: '방문 URL이 토렌트 색인·트래커 사이트(URL 분류 torrent)이거나 magnet: 링크: P2P 내려받기·유포 준비 정황(불법촬영물·저작권 사건의 입수 경로).'
  false_positive_ko: 리눅스 배포판 등 합법 토렌트, 검색 결과로 우연히 연 페이지. 사이트 도메인은 자주 바뀌므로 목록에 없는 사이트는 잡지 못함.
  sources:
  - https://en.wikipedia.org/wiki/Comparison_of_BitTorrent_sites
  - https://torrentfreak.com/top-torrent-sites/
  - https://www.bittorrent.org/beps/bep_0009.html
  version: 1
  status: provisional
  params: {}
