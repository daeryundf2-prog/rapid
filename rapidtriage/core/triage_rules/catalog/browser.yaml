  - key: method
    label: 요청 방식
  - key: response_size
    label: 응답 크기 (캐시된 응답, 업로드 파일 크기 아님)
    format: bytes
  - key: response_size_basis
    label: 크기 근거
  - key: source_artifact_type
    label: 원본 행 유형
    format: artifact_type
  - key: browser
    label: 브라우저
  - key: profile
    label: 프로필
  aux_columns:
  - key: match_pattern_id
    label: 일치 패턴
    format: mono
  - key: match_basis
    label: 패턴 근거
  - key: signals
    label: 신호
  - key: http_status
    label: 응답 상태
    format: number
  - key: content_type
    label: 콘텐츠 형식
  - key: source_path
    label: 원본 경로
    format: path
  - key: source_offset
