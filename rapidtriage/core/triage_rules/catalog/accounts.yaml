    label: 해시 저장됨(LM/NT)
    aliases:
    - nt_hash_present
  - key: key_path
    label: 키 경로
    aliases:
    - key
    format: path
  - key: password_last_set_at
    label: 암호 마지막 변경
    format: time
    ts_kind: password-last-set
  - key: account_expires_at
    label: 계정 만료
    format: time
    ts_kind: account-expires
  - key: rid_key_last_written_at
