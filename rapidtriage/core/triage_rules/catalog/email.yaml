  - key: account_fields
    label: 계정 XML 항목
  - key: eml_file_count
    label: EML 파일 수
    format: number
  - key: attachment_file_count
    label: 첨부 파일 수
    format: number
  - key: source_path
    semantic: path
    label: 원본
    format: path
  - key: parser_version
    label: 파서 버전
    format: mono
  rules: []
