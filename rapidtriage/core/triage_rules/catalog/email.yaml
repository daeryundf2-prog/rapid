# Triage catalogue: email (plan viewer-families-2026-10-15; research docs/research/forensic-field-catalog-*.md)
families:
- id: email
  label: 이메일
  types:
  - email-message
  - email-mailbox
  - cloud-mail
  kinds:
  - email
  # 시각: Outlook PST/OST rows carry the MAPI submit (else delivery) time; .eml/.msg rows the
  # Date header (the sender's claim, also as its own auxiliary column below).
  core_columns:
  - key: submit_time
    label: 시각(제출·배달·Date)
    aliases:
    - delivery_time
    - date
    - date_header
    format: time
    ts_kind: sent
    width: 170
  - key: from
    semantic: person_sender
    label: 보낸 사람
  - key: to
    semantic: person_recipient
    label: 받는 사람
    aliases:
    - cc
    - bcc
  - key: subject
    label: 제목
    width: 280
  - key: attachment_count
    label: 첨부
    aliases:
    - attachments
    format: number
    width: 70
  - key: folder
    label: 폴더
    aliases:
    - mailbox_folder
  - key: read_state
    label: 읽음
    width: 80
  aux_columns:
  - key: date
    label: Date 헤더(발신 주장)
    aliases:
    - date_header
    format: time
    ts_kind: sent
    width: 170
  - key: message_id
    label: 메시지 ID (Message-ID)
    format: mono
  - key: authentication_results
    label: 인증 결과(SPF/DKIM/DMARC)
    aliases:
    - auth_results
    format: mono
  - key: return_path
    semantic: person_sender
    label: 반송 주소 (Return-Path)
    format: mono
  - key: reply_to
    semantic: person_sender
    label: 회신 주소 (Reply-To)
    format: mono
  - key: received
    label: Received 체인
    format: mono
  - key: x_originating_ip
    semantic: device
    label: 발신 IP (X-Originating-IP)
    format: mono
  - key: thread_parent_id
    label: 상위 메시지 (In-Reply-To)
    aliases:
    - in_reply_to
    format: mono
  - key: body_preview
    label: 본문 미리보기
  - key: body_sha256
    semantic: hash
    label: 본문 SHA-256
    format: mono
  - key: source_format
    label: 원본 형식
  - key: attachments
    semantic: attachment
    label: 첨부 파일
  - key: cc
    semantic: person_recipient
    label: 참조 (CC)
  - key: bcc
    semantic: person_recipient
    label: 숨은 참조 (BCC)
  - key: delivery_time
    label: 배달 시각
    format: time
    ts_kind: received
    width: 170
  - key: thread_id
    label: 스레드 ID
    aliases:
    - conversation_topic
    format: mono
  - key: deleted_state
    label: 삭제·복구 상태
    width: 110
    value_labels:
      live: 활성
      live-row: 활성 행
      'false': 활성
      deleted: 삭제됨
      'true': 삭제됨
      deleted-or-recovered-candidate: 삭제·복구 후보
      candidate-marker-present: 삭제 표식 후보
      not-decoded: 해석 안 함
      unknown: 불명
      index-only: 색인에만 있음
      deleted-folder: 삭제 폴더
  # R5 L1: desktop mail clients (email-clients kind) attribute rows to client / account / store.
  - key: mail_client
    label: 메일 클라이언트
  - key: account
    semantic: account
    label: 계정
  - key: mailbox_store
    semantic: path
    label: 메일함 원본
    format: path
  rules:
  - email.spf_fail
  - email.dkim_fail
  - email.dmarc_fail
  - email.display_name_spoof
  - email.reply_to_differs
  - email.returnpath_from_mismatch
  - email.msgid_domain_mismatch
  - email.attach_double_ext
  - email.attach_ext_mime_mismatch
  - email.attach_exec_or_archive_enc
  - email.date_vs_received_skew
  - email.external_forward_auto
  - email.bcc_self_or_personal
  - email.external_bulk_attachments
  - email.deleted_folder_recent
