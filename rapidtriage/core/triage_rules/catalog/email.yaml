    label: 수신 서버
  - key: server_username
    semantic: account
    label: 서버 사용자 이름
  - key: smtp_hosts
    label: 보내는 서버(SMTP)
  - key: user
    label: 사용자 프로필
  aux_columns:
  - key: identity_names
    semantic: person
    label: 표시 이름
  - key: server_port
    label: 포트
    format: number
  - key: account_key
    label: 계정 키
    format: mono
  - key: server_directory
    label: 메일 폴더 위치
