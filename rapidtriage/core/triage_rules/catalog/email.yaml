# R5 L1: desktop mail clients (Thunderbird, Windows Mail, Windows Live Mail; email-clients kind).
- id: email-client-account
  label: 메일 클라이언트 계정
  types:
  - email-client-account
  core_columns:
  - key: mail_client
    label: 메일 클라이언트
  - key: account
    semantic: account
    label: 계정
  - key: identity_emails
    semantic: account
    label: 보내는 주소(ID)
  - key: server_type
    label: 서버 종류
    value_labels:
      imap: IMAP
      pop3: POP3
      none: 로컬 폴더
      rss: RSS
      nntp: 뉴스그룹
  - key: server_hostname
