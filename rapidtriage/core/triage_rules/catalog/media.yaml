  types:
  - media-image
  - media-video
  - media-audio
  - media-image-unreadable
  - mobile-media
  - cloud-photo
  kinds:
  - media-image
  core_columns:
  - key: exif_datetime_original
    label: 촬영 시각(EXIF, 현지)
    aliases:
    - datetime_original
    format: time
    ts_kind: captured
    width: 170
  - key: source_file_mtime
    label: 파일 수정
    format: time
    ts_kind: modified
    width: 170
  - key: exif_status
    label: EXIF 상태
    derive: exif_status
    width: 110
  - key: exif_make
    label: 제조사
  - key: exif_model
    label: 모델
  - key: gps_latitude
    semantic: geo
    label: 위도
    format: number
  - key: gps_longitude
    label: 경도
    format: number
  - key: exif_software
    label: 편집 SW
  - key: width
    label: 해상도
    aliases:
    - height
    format: number
  - key: content_format
    label: 형식
    aliases:
    - source_format
  - key: perceptual_hash
    semantic: hash
    label: 지각 해시 (pHash)
    format: mono
  aux_columns:
  - key: exif_datetime_digitized
    label: 디지털화 시각
    format: time
    ts_kind: digitized
  - key: gps_timestamp
    label: GPS 시각(UTC)
    format: time
    ts_kind: gps
  - key: exif_lens_model
    label: 렌즈
  - key: timestamp_timezone
    label: 시간대 근거
  - key: trailing_data_bytes
    label: 뒤붙은 데이터
    format: bytes
  - key: extension_mismatch
    label: 확장자 불일치
  - key: duration_seconds
    label: 재생 시간(초)
    format: number
  - key: entry_name
    label: 파일 이름
