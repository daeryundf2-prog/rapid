  - key: next_checks
    label: 다음 확인
  - key: scan_status
    label: 스캔 상태
    aliases:
    - scan_error
  - key: scan_file_count
    label: 스캔 파일 수
    format: number
  - key: unscanned_candidate_count
    label: 미선별 후보 수
