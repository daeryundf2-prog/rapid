- id: synthetic-media
  label: 합성 미디어 선별
  types: []
  prefixes:
  - synthetic-media
  kinds:
  - synthetic-media
  core_columns:
  - key: entry_name
    label: 파일
    aliases:
    - file_name
  - key: score
    label: 선별 점수
    format: number
  - key: band_label
    label: 점수 구간
    aliases:
    - band
  - key: verdict
    label: 선별 결과
  - key: score_semantics
    label: 점수 의미
  - key: score_guidance
    label: 점수 안내
  - key: signals
    label: 단서
  - key: signal_count
    label: 단서 수
    format: number
  - key: limitations
    label: 한계
  - key: source_guess
    label: 출처 추정
