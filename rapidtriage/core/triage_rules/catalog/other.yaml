rules:
- id: generic.timestamp_out_of_range
  family: generic
  grade: C
  label_ko: 비정상 시각(1980년 이전·미래)
  rationale_ko: '시각 필드가 1980-01-01 이전이거나 현재+1일 이후: 카빙된 LNK의 1628년 같은 쓰레기 값, 잘못된 단위 해석, 시계 조작. 그 행의 시각은 근거로 쓰기 전에 원본을 확인해야 함.'
  false_positive_ko: FILETIME 0(1601-01-01)·Unix 0(1970-01-01)·DOS 0(1980-01-01 현지 시각, UTC로 1979-12-31)은 시간대가 밀린 값까지 "시각 없음"이라 제외. 쿠키·인증서 만료, 생일, 예약 실행, PE 링크 시각(Windows 10 재현 빌드는 해시 값)·드라이버 버전 날짜처럼 원래 먼 과거/미래이거나 시각이 아닌 필드는 excluded_key_terms로 제외.
  sources:
  - https://www.csirt.gov.sk/wp-content/uploads/2021/08/LNK_File_Forensics.pdf
  - https://learn.microsoft.com/en-us/windows/win32/sysinfo/file-times
  version: 1
  status: provisional
  params:
    min_year: 1980
    future_days: 1
    excluded_key_terms:
    - expir
    - valid_to
    - valid_until
    - not_after
    - birth
    - due
    - scheduled
    - next_run
    - link_date
    - link_time
    - compil
    - version_date
