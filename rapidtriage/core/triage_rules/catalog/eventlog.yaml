- id: eventlog.rdp_external_ip
  family: eventlog-event
  grade: A
  label_ko: 외부 IP RDP 로그온
  rationale_ko: '4624 로그온 유형 10(원격 대화형)의 IpAddress가 사설망·루프백·링크로컬이 아닌 공인 주소: 인터넷에 노출된 RDP로 들어온 접속.'
  false_positive_ko: VPN·점프호스트 NAT, 공인 IPv6를 쓰는 사내망.
  sources:
  - https://docs.logpoint.com/agentx/references/windows-event-ids-reference
  - https://attack.mitre.org/techniques/T1021/001/
  version: 1
  status: verified
  validation:
    synthetic: true
    real:
    - source: run-subset10 이벤트 로그(음성)
      result: negative
      hits: 0
      false_positives: 0
      checked_at: '2026-10-21'
      note_ko: '입력 가능 이벤트 로그 292,370행에서 0적중(기대 최대 0, 통과). 서브셋에 유형 10 외부 IP 로그온이 없어 양성은 확인하지 못함. r6-s1-run·qa-case1·r4-v1 런은 같은 증거를 다시 처리한 것이라 독립 근거가 아님.'
    public: []
    notes_ko: 실데이터는 음성 대조만(0적중·오탐 0). 양성 실데이터 없음 — 공개 데이터셋·VM 생성은 사용자 승인 대기.
  params: {}
- id: eventlog.failed_logon_burst
  family: eventlog-event
  grade: B
  label_ko: 로그온 실패 폭주(4625)
  rationale_ko: '같은 출발지 IP(없으면 같은 대상 계정)의 4625가 짧은 시간 안에 임계값 이상: 무차별 대입 시도.'
  false_positive_ko: 암호가 만료된 서비스 계정, 취약점 스캐너.
  sources:
  - https://docs.logpoint.com/agentx/references/windows-event-ids-reference
  - https://attack.mitre.org/techniques/T1110/
  version: 1
  status: verified
  params:
    window_minutes: 5
    min_count: 10
- id: eventlog.burst_then_success
  family: eventlog-event
  grade: B
  label_ko: 실패 폭주 뒤 로그온 성공
  rationale_ko: '4625 폭주와 같은 출처(IP 또는 계정)에서 폭주 중이거나 직후에 4624 성공: 무차별 대입 성공 가능성.'
  false_positive_ko: 사용자 오타 반복 뒤 정상 로그온.
  sources:
  - https://docs.logpoint.com/agentx/references/windows-event-ids-reference
  - https://attack.mitre.org/techniques/T1110/
  version: 1
  status: verified
  params:
    window_minutes: 5
    min_count: 10
    success_within_minutes: 60
- id: eventlog.log_cleared
  family: eventlog-event
  grade: A
  label_ko: 이벤트 로그 삭제(1102/104)
  rationale_ko: 'Security 1102 또는 System 104(Eventlog 제공자): 이벤트 로그가 지워짐. 안티포렌식의 대표 흔적.'
  false_positive_ko: 에이전트 롤아웃·골든 이미지 준비 과정의 정상 삭제(Sigma 규칙 참고).
  sources:
  - https://detection.fyi/sigmahq/sigma/windows/builtin/system/microsoft_windows_eventlog/win_system_eventlog_cleared/
  - https://attack.mitre.org/techniques/T1070/001/
  version: 1
  status: verified
  validation:
    synthetic: true
    real:
    - source: run-subset10 이벤트 로그(음성)
      result: negative
      hits: 0
      false_positives: 0
      checked_at: '2026-10-21'
      note_ko: '입력 가능 이벤트 로그 292,370행에서 0적중(기대 최대 0, 통과). 서브셋 Security/System에 1102·104가 없어 양성은 확인하지 못함. r6-s1-run·qa-case1·r4-v1 런은 같은 증거를 다시 처리한 것이라 독립 근거가 아님.'
    public: []
    notes_ko: 실데이터는 음성 대조만(0적중·오탐 0). 양성 실데이터 없음 — 공개 데이터셋·VM 생성은 사용자 승인 대기.
  params: {}
- id: eventlog.record_id_gap
  family: eventlog-event
  grade: C
  label_ko: 레코드 번호 갭
  rationale_ko: '같은 .evtx 파일의 할당(live) 레코드 EventRecordID가 크게 건너뜀: 레코드 삭제·청크 손실 가능성.'
  false_positive_ko: 파서가 일부 레코드를 해석하지 못한 경우, 손상 청크.
  sources:
  - https://attack.mitre.org/techniques/T1070/001/
  version: 1
  status: provisional
  params:
    min_gap: 10
- id: eventlog.new_service
  family: eventlog-event
  grade: B
  label_ko: 의심 경로 서비스 설치(7045/4697)
  rationale_ko: '서비스 설치 이벤트의 ImagePath가 Temp/AppData/UNC/cmd/PowerShell: 지속성 확보·PsExec류 횡이동.'
  false_positive_ko: 정상 설치 프로그램·드라이버(주체가 SYSTEM인 경우가 흔함). Defender 플랫폼·정의 업데이트 서비스(ProgramData\Microsoft\Windows Defender)는 제외.
  sources:
