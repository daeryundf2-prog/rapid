rules:
- id: ai.credential_file_present
  family: ai-config
  grade: C
  label_ko: AI 도구 자격 증명 파일 존재
  rationale_ko: 'AI 도구의 토큰·OAuth·쿠키·키 파일이 있음(값은 수집하지 않음): 이 PC에서 그 도구 계정에 로그인한 상태였다는 정황. 계정 소유·서버 측 기록 확인의 출발점.'
  false_positive_ko: 설치만 하고 쓰지 않은 도구의 빈 설정, 만료된 토큰 파일.
  sources:
  - https://docs.anthropic.com/en/docs/claude-code/iam
  - https://developers.openai.com/codex/auth
  version: 1
  status: provisional
  validation:
    synthetic: true
    real:
    - source: run-subset10(AI 행 없음)
      result: not_applicable
      hits: 0
      checked_at: '2026-10-27'
      note_ko: 서브셋 런에 ai-agent 행이 0행이라 규칙 입력이 없음. 0적중은 음성 근거가 아님.
    public: []
    notes_ko: 합성 픽스처(tests/fixtures/ai_agents) 35행에서 적중 확인. 실데이터 양성은 이 PC 실물 런(Q-AI9) 승인 대기.
  params: {}
- id: ai.destructive_tool_call
  family: ai-tool-call
  grade: B
  label_ko: AI 에이전트의 파괴적 명령·도구 호출
  rationale_ko: '에이전트 도구 호출이 도구 자체 기록상 파괴적(destructive=true)이거나 명령이 rm·del·rmdir·Remove-Item·format·shred를 씀: 증거 인멸·대량 삭제 지시 정황(S4).'
  false_positive_ko: 빌드 산출물·임시 폴더 정리(빌드 폴더·패키지 의존성 폴더 rm -rf), 테스트 데이터 삭제.
  sources:
  - https://docs.anthropic.com/en/docs/claude-code/settings
  - https://attack.mitre.org/techniques/T1070/004/
  version: 1
  status: provisional
  validation:
    synthetic: true
    real:
    - source: run-subset10(AI 행 없음)
      result: not_applicable
      hits: 0
      checked_at: '2026-10-27'
      note_ko: 서브셋 런에 ai-agent 행이 0행이라 규칙 입력이 없음. 0적중은 음성 근거가 아님.
    public: []
    notes_ko: 합성 픽스처의 ZCode destructive=1·Claude Code rm -rf·Codex/OmO Remove-Item 호출에서 적중, ls·git status 같은 읽기 호출에서는 미적중 확인.
  params:
    command_patterns:
    - (?:^|[\s;&|(`"'])rm\s
    - (?:^|[\s;&|(`"'])rmdir\b
    - (?:^|[\s;&|(`"'])(?:del|erase)\s
    - (?:^|[\s;&|(`"'])rd\s+/s
    - (?:^|[\s;&|(`"'])remove-item\b
    - '(?:^|[\s;&|(`"''])format(?:\.com)?\s+[a-z]:'
    - (?:^|[\s;&|(`"'])shred\b
- id: ai.evidence_path_in_tool_call
  family: ai-tool-call
  grade: B
  label_ko: AI 도구 호출 경로가 사건 증거·이동식 드라이브·클라우드 동기화 폴더
  rationale_ko: '에이전트 도구 호출·파일 접촉 경로가 지정한 사건 증거 폴더, 이 런에서 이동식으로 확인된 드라이브 문자(또는 /Volumes·/media), 클라우드 동기화 폴더(동기화 클라이언트 행의 동기화 루트·기본 폴더 이름) 아래: 자료 반출·열람 지시 정황(S1).'
  false_positive_ko: OneDrive로 리디렉션된 문서·바탕 화면 폴더에서의 정상 작업, 데이터용 외장 디스크에 둔 저장소.
  sources:
  - https://docs.anthropic.com/en/docs/claude-code/settings
  - https://attack.mitre.org/techniques/T1052/001/
  - https://attack.mitre.org/techniques/T1567/002/
  version: 1
  status: provisional
  validation:
    synthetic: true
    real:
    - source: run-subset10(AI 행 없음)
      result: not_applicable
      hits: 0
      checked_at: '2026-10-27'
      note_ko: 서브셋 런에 ai-agent 행이 0행이라 규칙 입력이 없음. 0적중은 음성 근거가 아님.
    public: []
    notes_ko: 합성 픽스처에 OneDrive·E:(이동식)·사건 폴더 경로 도구 호출을 더해 적중, 사용자 프로젝트 폴더 경로에서는 미적중 확인.
  params:
    evidence_roots: []
    cloud_folder_markers:
    - \onedrive\
    - \onedrive -
    - \dropbox\
    - \google drive\
    - \my drive\
    - \icloud drive\
    - \iclouddrive\
    - \mybox\
    - \naver mybox\
    - /library/cloudstorage/
    - /library/mobile documents/
    removable_mount_prefixes:
    - /volumes/
    - /media/
    - /run/media/
- id: ai.account_switch
  family: ai-account
  grade: C
  label_ko: AI 도구 계정 전환
  rationale_ko: '한 PC에서 AI 도구 계정을 바꾼 기록(claude-swap 전환 로그 등): 여러 계정(개인·회사) 사용 정황(S2).'
  false_positive_ko: 회사가 계정 여러 개를 배정한 경우, 사용량 한도 때문에 공용 계정을 돌려 쓴 경우.
  sources:
  - https://github.com/realiti4/claude-swap
  version: 1
  status: provisional
  validation:
    synthetic: true
    real:
    - source: run-subset10(AI 행 없음)
      result: not_applicable
      hits: 0
      checked_at: '2026-10-27'
      note_ko: 서브셋 런에 ai-agent 행이 0행이라 규칙 입력이 없음. 0적중은 음성 근거가 아님.
    public: []
    notes_ko: 합성 claude-swap 로그의 전환 2줄에서 적중 확인.
  params: {}
- id: ai.personal_account_on_corporate
  family: ai-account
  grade: B
  label_ko: 업무용 PC의 개인 AI 계정
  rationale_ko: 'AI 도구 계정의 이메일 도메인이 런 옵션으로 지정한 조직 도메인과 다름: 업무 자료를 개인 계정 AI에 넣었을 정황(S2). 조직 도메인을 지정하지 않으면 규칙이 실행되지 않음.'
  false_positive_ko: 협력사·자회사 도메인, 조직이 승인한 개인 구독, 도메인 별칭.
  sources:
  - https://support.anthropic.com/en/articles/9797531-what-is-the-enterprise-plan
  - https://attack.mitre.org/techniques/T1567/
  version: 1
  status: provisional
  validation:
    synthetic: true
    real:
    - source: run-subset10(AI 행 없음)
      result: not_applicable
      hits: 0
      checked_at: '2026-10-27'
      note_ko: 서브셋 런에 ai-agent 행이 0행이고 조직 도메인도 지정되지 않음.
    public: []
    notes_ko: 합성 계정(corp.example 조직, gmail.example 개인)에서 조직 도메인을 지정했을 때만 개인 계정에 적중, 지정하지 않으면 0적중 확인.
  params:
    org_email_domain: ''
- id: ai.retention_cleanup_observed
  family: ai-config
  grade: C
  label_ko: AI 기록 보존 정리 흔적
  rationale_ko: 'AI 도구의 보존 기간 정리 표식(Claude Code .last-cleanup 등)이 있음: 그 이전 세션 기록은 자동 삭제되었을 수 있어 부재 ≠ 미사용.'
  false_positive_ko: 해당 없음(한계 표기) — 기본 설정의 자동 정리.
  sources:
  - https://docs.anthropic.com/en/docs/claude-code/settings
  version: 1
  status: provisional
  validation:
    synthetic: true
    real:
    - source: run-subset10(AI 행 없음)
      result: not_applicable
