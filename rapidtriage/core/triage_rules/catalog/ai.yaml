# traces, agent sessions and their messages, tool calls, file touches, MCP servers, instruction and
# credential-presence files (values never collected), accounts and account switches, code
# attribution (Cursor scoring, git trailers) and usage. Rule implementations: core/triage_rules/ai.py.
