# Triage catalogue: P2P (R5 L3, 재감사 §3 item 10): BitTorrent clients (qBittorrent, µTorrent/BitTorrent,
# FrostWire), any .torrent file, and eMule (known.met, *.part.met, AC_SearchStrings.dat, preferences.ini).
families:
- id: p2p-torrent
  label: 토렌트 파일
  types:
  - p2p-torrent
  core_columns:
  - key: timestamp
    label: 토렌트 작성 시각
    aliases:
    - created_at
    format: time
    ts_kind: torrent-created
    width: 170
  - key: name
    label: 이름
  - key: info_hash
    semantic: hash
    label: 정보 해시(info-hash v1)
    format: mono
  - key: total_size
    label: 전체 크기
    format: bytes
  - key: file_count
    label: 파일 수
    format: number
  # No attachment tag: a .torrent's file list is what it describes, not a file that was
  # transferred (p2p-shared-file file_name, a file eMule shared, keeps the tag).
  - key: files
    label: 파일 목록(표본)
  - key: trackers
    semantic: url
    label: 트래커(호스트만)
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: source_path
    semantic: path
    label: 토렌트 파일
    format: path
  aux_columns:
  - key: info_hash_v2
    semantic: hash
    label: 정보 해시(info-hash v2)
    format: mono
  - key: created_by
    label: 작성 프로그램
  - key: comment
    label: 설명
  - key: private
    label: 비공개 트래커
  - key: piece_length
    label: 조각 크기
    format: bytes
  - key: user
    semantic: account
    label: 사용자
  rules: []
- id: p2p-transfer
  label: P2P 전송 기록
  types:
  - p2p-transfer
  core_columns:
  - key: timestamp
    label: 시각
    format: time
    ts_kind: transfer-completed
    width: 170
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: name
    label: 이름
    aliases:
    - file_name
  - key: state
    label: 상태
    value_labels:
      completed: 완료
      incomplete: 미완료
  - key: added_at
    label: 추가
    format: time
    ts_kind: transfer-added
  - key: completed_at
    label: 완료
    format: time
    ts_kind: transfer-completed
  - key: save_path
    semantic: path
    label: 저장 경로
    format: path
  - key: downloaded_bytes
    label: 받은 양
    format: bytes
  - key: uploaded_bytes
    label: 보낸 양(유포)
    format: bytes
  - key: info_hash
    semantic: hash
    label: 정보 해시(info-hash)
    aliases:
    - ed2k_hash
    format: mono
  aux_columns:
  - key: file_size
    label: 파일 크기
    format: bytes
  - key: part_file_name
    label: 임시 파일(.part)
  - key: category
    label: 분류
  - key: tags
    label: 태그
  - key: active_seconds
    label: 활동 시간(초)
    format: number
  - key: seeding_seconds
    label: 시딩 시간(초)
    format: number
  - key: trackers
    semantic: url
    label: 트래커(호스트만)
  - key: client_entry_key
    label: 클라이언트 항목 키
  - key: source_path
    semantic: path
    label: 원본 파일
    format: path
  - key: user
    semantic: account
    label: 사용자
  rules:
  - p2p.torrent_seeding_uploaded
  - p2p.transfer_completed
- id: p2p-shared-file
  label: eMule 공유·완료 파일
  types:
  - p2p-shared-file
  core_columns:
  - key: timestamp
    label: 마지막 공유
    aliases:
    - last_shared_at
    format: time
    ts_kind: last-shared
    width: 170
  - key: file_name
    semantic: attachment
    label: 파일 이름
  - key: file_size
    label: 크기
    format: bytes
  - key: ed2k_hash
    semantic: hash
    label: ed2k 해시(MD4)
    format: mono
  - key: all_time_uploaded_bytes
    label: 누적 업로드(유포)
    format: bytes
  - key: all_time_requests
    label: 누적 요청
    format: number
  - key: all_time_accepted
    label: 누적 수락
    format: number
  - key: file_date
    label: 파일 날짜
    format: time
    ts_kind: file-date
  aux_columns:
  - key: ed2k_link
    label: ed2k 링크
    format: mono
  - key: file_type
    label: 파일 형식
  - key: source_path
    semantic: path
    label: 원본(known.met)
    format: path
  - key: user
    semantic: account
    label: 사용자
  rules:
  - p2p.emule_shared_uploaded
- id: p2p-search-term
  label: P2P 검색어
  types:
  - p2p-search-term
  core_columns:
  - key: term
    semantic: search_term
    label: 검색어
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: list_position
    label: 목록 순서
    format: number
  - key: source_path
    semantic: path
    label: 원본
    format: path
  aux_columns:
  - key: time_note
    label: 시각
  - key: user
    semantic: account
    label: 사용자
  rules: []
- id: p2p-client-config
  label: P2P 클라이언트 설정
  types:
  - p2p-client-config
  core_columns:
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: nick
    semantic: account
    label: 닉네임
  - key: incoming_dir
    semantic: path
    label: 받은 파일 폴더
    format: path
  - key: temp_dir
    semantic: path
    label: 임시 폴더
    format: path
  - key: app_version
    label: 버전
  - key: source_path
    label: 설정 파일
    format: path
  aux_columns:
  - key: user
    semantic: account
    label: 사용자
  rules: []
- id: p2p-error
  label: P2P 읽기 오류
  types:
  - p2p-parse-error
  core_columns:
  - key: client_label
    label: 클라이언트
    aliases:
    - client
  - key: reason
    label: 사유
    value_labels:
      torrent-unreadable: .torrent 읽기 실패
      resume-unreadable: 이어받기 정보 읽기 실패
      resume-not-a-dictionary: 이어받기 정보 형식 아님
      resume-dat-unreadable: resume.dat 읽기 실패
      resume-dat-not-a-dictionary: resume.dat 형식 아님
      row-cap-reached: 행 상한 도달
      known-met-unreadable: known.met 읽기 실패
      part-met-unreadable: .part.met 읽기 실패
      search-strings-unreadable: 검색어 파일 읽기 실패
      preferences-unreadable: preferences.ini 읽기 실패
      torrent-file-cap-reached: .torrent 파일 수 상한 도달
      source-failed: 원본 처리 실패
  - key: error_message
    label: 오류
  - key: source_path
    semantic: path
    label: 원본
    format: path
  aux_columns:
  - key: error_type
    label: 오류 종류
  rules: []
rules:
- id: p2p.torrent_seeding_uploaded
  family: p2p-transfer
  grade: B
  label_ko: 토렌트 업로드(시딩) 기록
  rationale_ko: 'BitTorrent 클라이언트 전송 기록에 다른 사용자에게 보낸 양(uploaded)이 있음: 내려받는 동안·뒤에 조각을 공유한 유포 정황(불법촬영물·저작권 사건의 유포 요건).'
  false_positive_ko: 합법 배포물 공유. 보낸 양은 클라이언트 누적 통계이며 상대·시각별 내역은 아님.
  sources: &id001
  - https://www.bittorrent.org/beps/bep_0003.html
  - https://www.libtorrent.org/manual-ref.html
  - https://github.com/qbittorrent/qBittorrent/wiki/Explanation-of-Options-in-qBittorrent
  - https://www.emule-project.net/home/perl/help.cgi?l=1&rm=show_topic&topic_id=232
  - https://forensics.wiki/emule/
  version: 1
  status: provisional
  params:
    min_uploaded_bytes: 1
- id: p2p.transfer_completed
  family: p2p-transfer
  grade: C
  label_ko: P2P 내려받기 완료
  rationale_ko: '토렌트·eMule 전송이 완료됨(완료 시각 있음): 파일 입수 정황, 저장 경로에서 실물 확인.'
  false_positive_ko: 합법 배포물(리눅스 배포판·게임 패치).
  sources: *id001
  version: 1
  status: provisional
  params: {}
- id: p2p.emule_shared_uploaded
  family: p2p-shared-file
  grade: B
  label_ko: eMule 공유 파일 업로드 기록
  rationale_ko: 'eMule known.met의 공유 파일에 누적 업로드량·수락된 요청이 있음: 다른 사용자에게 파일을 보낸 유포 정황(국내 "당나귀" 유포 사건).'
  false_positive_ko: 공유 폴더 기본 설정으로 의도 없이 공유된 파일. 누적 통계이며 시각·상대는 없음.
  sources: *id001
  version: 1
  status: provisional
  params:
    min_uploaded_bytes: 1
