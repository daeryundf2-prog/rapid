# 웹메일·웹하드·파일 공유 업로드 후보 URL 패턴 (plan r2-communication-2026-10-17 §3.3 M3).
#
# 브라우저 캐시 항목(browser-cache-entry)·방문 기록(browser-history/browser-visit) URL이 아래 패턴에
# 걸리면 web-upload-candidate 행이 된다. 패턴은 조사 우선순위를 돕는 단서이며 판단이 아니다.
#
# 한 패턴이 걸리는 조건: 호스트가 hosts 중 하나와 같거나 그 하위 도메인이고(host_tokens는 호스트의
#   점(.)으로 나뉜 한 구획이 그 토큰과 같을 때 — 부분 문자열 아님),
#   path_regex가 있으면 URL 경로(질의 문자열 제외)에 맞고, query_regex가 있으면 질의 문자열에 맞고,
#   query_keys가 있으면 그중 한 키가 질의에 있다.
#   post_only: true 패턴은 POST/PUT 요청(캐시 키의 업로드 id)일 때만 걸리고 경로는 보지 않는다.
# 공통 제외(코드 web_upload.py): 경로에 download/read/view/viewer/preview/attachIndex 같은 열람·내려받기
#   토큰이 있거나 마지막 경로 구획이 정적 자원(.png .gif .jpg .svg .ico .js .css .woff .woff2 등)이면
#   어떤 패턴도 걸리지 않는다(btn_upload.png, upload.js, download.aspx, /read/ 페이지 등).
# strength: strong(공개 문서로 확인된 업로드 API 엔드포인트) / medium(업로드 API 휴리스틱·서비스 호스트로 간 POST) /
#   weak(업로드 화면·경로 토큰만 보이는 GET, 첨부 참조 — 업로드인지 열람인지 구분 불가).
#   POST/PUT 캐시 항목은 한 단계 올린다(weak→medium, medium→strong; post_only 패턴은 제외).
#   규칙 browser.webmail_upload / browser.filesharing_upload는 기본 medium 이상만 표시한다(weak는 걸러짐).
# basis: documented(sources의 공개 API·도움말 문서) / heuristic(공개 문서 없음 — 서비스 도메인과 경로 토큰 기반).
# 각 패턴의 sources는 서비스·엔드포인트 근거(https)다. 호스트는 소문자, 스킴·경로·포트 없이 적는다.
version: 2
patterns:
# --- 웹메일 -------------------------------------------------------------------------
- id: naver-mail-attach
  service: naver-mail
  label_ko: 네이버 메일 첨부 업로드 경로
  category: webmail
  hosts: [mail.naver.com, bigfile.mail.naver.com, files.mail.naver.com]
  path_regex: '(?i)^(?:/[a-z0-9_-]+)*/(?:upload|bigfile/upload|attach/upload|upload/attach|fileupload|bigfileupload)(?:\.(?:json|do|nhn))?/?$'
  strength: weak
  basis: heuristic
  sources:
  - https://help.naver.com/
  - https://mail.naver.com/
- id: naver-mail-post
  service: naver-mail
  label_ko: 네이버 메일 호스트로 간 POST 요청
  category: webmail
  hosts: [mail.naver.com, bigfile.mail.naver.com, files.mail.naver.com]
  post_only: true
  strength: medium
  basis: heuristic
  sources:
  - https://mail.naver.com/
- id: daum-mail-attach
  service: daum-mail
  label_ko: 다음 메일 첨부 업로드 경로
  category: webmail
  hosts: [mail.daum.net, bigfile.mail.daum.net]
  path_regex: '(?i)^(?:/[a-z0-9_-]+)*/(?:upload|bigfile/upload|attach/upload|upload/attach|fileupload|bigfileupload)(?:\.(?:json|do|daum))?/?$'
  strength: weak
  basis: heuristic
  sources:
  - https://cs.daum.net/
  - https://mail.daum.net/
- id: daum-mail-post
  service: daum-mail
  label_ko: 다음 메일 호스트로 간 POST 요청
  category: webmail
  hosts: [mail.daum.net, bigfile.mail.daum.net]
  post_only: true
  strength: medium
  basis: heuristic
  sources:
  - https://mail.daum.net/
- id: gmail-upload
  service: gmail
  label_ko: Gmail 첨부 업로드 경로
  category: webmail
  hosts: [mail.google.com]
  path_regex: '(?i)^/(?:mail/u/\d+/)?upload/?$'
  strength: weak
  basis: heuristic
  sources:
  - https://support.google.com/mail/answer/6584
- id: gmail-post
  service: gmail
  label_ko: Gmail 업로드 경로로 간 POST 요청
  category: webmail
  hosts: [mail.google.com]
  path_regex: '(?i)^/(?:mail/u/\d+/)?upload/?$'
  post_only: true
  strength: medium
  basis: heuristic
  sources:
  - https://support.google.com/mail/answer/6584
- id: gmail-attachment-ref
  service: gmail
  label_ko: Gmail 첨부 참조(attid)
  category: webmail
  hosts: [mail.google.com, mail-attachment.googleusercontent.com]
  query_keys: [attid]
  strength: weak
  basis: documented
  sources:
  - https://developers.google.com/gmail/api/reference/rest/v1/users.messages.attachments/get
- id: outlook-web-attach
  service: outlook-web
  label_ko: Outlook 웹 첨부 생성(CreateAttachment)
  category: webmail
  hosts: [outlook.live.com, outlook.office.com, outlook.office365.com]
  path_regex: '(?i)^/owa/(?:[^/]+/)?service\.svc/?$'
  query_regex: '(?i)(?:^|&)action=CreateAttachment'
  strength: strong
  basis: documented
  sources:
  - https://learn.microsoft.com/en-us/exchange/client-developer/web-service-reference/createattachment-operation
- id: outlook-graph-attach
  service: outlook-web
  label_ko: Outlook 메일 첨부 업로드 세션(Graph)
  category: webmail
  hosts: [graph.microsoft.com, outlook.office.com]
  path_regex: '(?i)^/(?:v1\.0|beta|api/v2\.0)/(?:me|users/[^/]+)/messages/[^/]+/attachments(?:/createUploadSession)?/?$'
  post_only: true
  strength: strong
  basis: documented
  sources:
  - https://learn.microsoft.com/en-us/graph/outlook-large-attachments
- id: outlook-web-post
  service: outlook-web
  label_ko: Outlook 웹 첨부 엔드포인트로 간 POST 요청
  category: webmail
  hosts: [outlook.live.com, outlook.office.com, outlook.office365.com, attachment.outlook.live.net]
  path_regex: '(?i)^/owa/(?:[^/]+/)?service\.svc/?$'
  query_regex: '(?i)(?:^|&)action=(?:CreateAttachment|UploadFile)'
  post_only: true
  strength: strong
  basis: documented
  sources:
  - https://learn.microsoft.com/en-us/exchange/client-developer/web-service-reference/createattachment-operation
# --- 개인 클라우드 ---------------------------------------------------------------------
- id: google-drive-upload
  service: google-drive
  label_ko: Google Drive 업로드 API
  category: cloud
  hosts: [googleapis.com, clients6.google.com, drive.google.com]
  path_regex: '(?i)^/upload/drive/v\d+/files(?:/[^/]+)?/?$'
  strength: strong
  basis: documented
  sources:
  - https://developers.google.com/drive/api/guides/manage-uploads
- id: google-drive-resumable
  service: google-drive
  label_ko: Google Drive 업로드(재개 가능 세션)
  category: cloud
  hosts: [drive.google.com, docs.google.com, clients6.google.com]
  path_regex: '(?i)^/upload/'
  query_keys: [upload_id, uploadType]
  strength: medium
  basis: documented
  sources:
  - https://developers.google.com/drive/api/guides/manage-uploads
- id: google-drive-post
  service: google-drive
  label_ko: Google Drive 업로드 경로로 간 POST 요청
  category: cloud
  hosts: [drive.google.com, clients6.google.com]
  path_regex: '(?i)^/upload/'
  post_only: true
  strength: medium
  basis: documented
  sources:
  - https://developers.google.com/drive/api/guides/manage-uploads
- id: dropbox-upload
  service: dropbox
  label_ko: Dropbox 업로드 API
  category: cloud
  hosts: [content.dropboxapi.com]
  path_regex: '(?i)^/2/files/(?:upload|upload_session/(?:start|append_v2|append|finish|finish_batch(?:_v2)?))/?$'
  strength: strong
  basis: documented
  sources:
  - https://www.dropbox.com/developers/documentation/http/documentation
- id: dropbox-web-upload
  service: dropbox
  label_ko: Dropbox 웹 업로드 경로
  category: cloud
  hosts: [dropbox.com]
  path_regex: '(?i)^/(?:cmd/upload|upload)/?$'
  strength: weak
  basis: heuristic
  sources:
  - https://help.dropbox.com/create-upload/upload-files
- id: dropbox-post
  service: dropbox
  label_ko: Dropbox 업로드 호스트로 간 POST 요청
  category: cloud
  hosts: [content.dropboxapi.com]
  post_only: true
  strength: medium
  basis: documented
  sources:
  - https://www.dropbox.com/developers/documentation/http/documentation
- id: onedrive-upload
  service: onedrive
  label_ko: OneDrive 업로드 세션 생성
  category: cloud
  hosts: [onedrive.live.com, api.onedrive.com, graph.microsoft.com, my.microsoftpersonalcontent.com]
  path_regex: '(?i)/(?:drive|drives/[^/]+)/(?:items/[^/:]+|root)(?::[^:]*:)?/createUploadSession/?$'
  strength: strong
  basis: documented
  sources:
  - https://learn.microsoft.com/en-us/onedrive/developer/rest-api/api/driveitem-createuploadsession
- id: onedrive-post
  service: onedrive
  label_ko: OneDrive 업로드 호스트로 간 POST/PUT 요청
  category: cloud
  hosts: [api.onedrive.com, my.microsoftpersonalcontent.com, up.1drv.com]
  post_only: true
  strength: medium
  basis: documented
  sources:
  - https://learn.microsoft.com/en-us/onedrive/developer/rest-api/api/driveitem-createuploadsession
- id: naver-mybox-upload
  service: naver-mybox
  label_ko: 네이버 MYBOX 업로드 경로
  category: cloud
  hosts: [mybox.naver.com, ndrive.naver.com]
  path_regex: '(?i)^(?:/[a-z0-9_-]+)*/(?:upload|fileupload|uploadfile)(?:\.(?:json|do|nhn))?/?$'
  strength: weak
  basis: heuristic
  sources:
  - https://mybox.naver.com/
- id: naver-mybox-post
  service: naver-mybox
  label_ko: 네이버 MYBOX 호스트로 간 POST 요청
  category: cloud
  hosts: [mybox.naver.com, ndrive.naver.com]
  post_only: true
  strength: medium
  basis: heuristic
  sources:
  - https://mybox.naver.com/
# --- 파일 공유 -------------------------------------------------------------------------
- id: wetransfer-upload
  service: wetransfer
  label_ko: WeTransfer 전송 생성·파일 업로드 API
  category: filesharing
  hosts: [wetransfer.com]
  path_regex: '(?i)^(?:/api/v4/transfers(?:/link|/email)?|/v2/transfers|/api/v4/transfers/[a-z0-9]+/files(?:/[a-z0-9]+)?/(?:upload-url|part-put-url|finalize-mpp)|/v2/transfers/[a-z0-9]+/files/[a-z0-9]+/(?:upload-url/\d+|upload-complete)|/api/v4/transfers/[a-z0-9]+/finalize|/v2/transfers/[a-z0-9]+/finalize)/?$'
  strength: medium
  basis: documented
  sources:
  - https://developers.wetransfer.com/
- id: wetransfer-post
  service: wetransfer
  label_ko: WeTransfer 호스트로 간 POST 요청
  category: filesharing
  hosts: [wetransfer.com]
  post_only: true
  strength: medium
  basis: heuristic
  sources:
  - https://developers.wetransfer.com/
