  category: filesharing
  hosts: [send-anywhere.com, sendanywhere.com]
  path_regex: '(?i)^(?:/web)?(?:/v\d+)?/(?:key|upload)/?$'
  strength: weak
  basis: heuristic
  sources:
  - https://send-anywhere.com/
- id: sendanywhere-post
  service: sendanywhere
  label_ko: Send Anywhere 호스트로 간 POST 요청
  category: filesharing
  hosts: [send-anywhere.com, sendanywhere.com]
  post_only: true
  strength: medium
  basis: heuristic
  sources:
  - https://send-anywhere.com/
- id: mega-upload
  service: mega
  label_ko: MEGA 업로드 경로
  category: filesharing
  hosts: [mega.nz, mega.io, mega.co.nz, userstorage.mega.co.nz]
  path_regex: '(?i)^/(?:ul|upload)/'
  strength: weak
  basis: heuristic
  sources:
  - https://mega.io/
- id: mega-post
  service: mega
  label_ko: MEGA 저장 서버로 간 POST 요청
  category: filesharing
  hosts: [userstorage.mega.co.nz]
  post_only: true
  strength: medium
