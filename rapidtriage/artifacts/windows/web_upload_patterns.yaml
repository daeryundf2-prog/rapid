  - https://mega.io/
- id: webhard-upload
  service: webhard
  label_ko: 웹하드 업로드 경로
  category: filesharing
  hosts: [webhard.co.kr]
  host_tokens: [webhard]
  path_regex: '(?i)^(?:/[a-z0-9_-]+)*/(?:file_?)?(?:upload|up_?load|fileup)(?:_?file)?(?:\.(?:php|aspx?|jsp|do))?/?$'
  strength: weak
  basis: heuristic
  sources:
  - https://www.webhard.co.kr/
- id: webhard-post
  service: webhard
  label_ko: 웹하드 POST 요청
  category: filesharing
  hosts: [webhard.co.kr]
  host_tokens: [webhard]
  post_only: true
  strength: medium
  basis: heuristic
  sources:
  - https://www.webhard.co.kr/
