[package]
name = "rapid-ntfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust port of RapidTriage's native $MFT FILE-record and $UsnJrnl:$J parsers (opt-in, PyO3)"

[lib]
name = "rapid_ntfs"
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
python = ["dep:pyo3"]
